fmdbsfdc_createLeadAction=Create Salesforce Lead
fmdbsfdc_createLeadAction.ui.tooltip=Creates a Lead in Salesforce from the submitted values. Map each Salesforce Lead field to a form field or to a constant value.
fmdbsfdc_createLeadAction.connectionId=Salesforce connection
fmdbsfdc_createLeadAction.connectionId.ui.tooltip=Salesforce org to send the lead to. The list of connections is managed by an administrator in the module configuration.
fmdbsfdc_createLeadAction.fieldMapping=Lead field mapping
fmdbsfdc_createLeadAction.fieldMapping.ui.tooltip=For each Salesforce Lead field, choose the form field whose value is sent, or type a constant value. Last Name and Company are mandatory in Salesforce.
fmdbsfdc_createLeadAction.duplicateStrategy=Duplicate handling
fmdbsfdc_createLeadAction.duplicateStrategy.ui.tooltip=What to do when a lead with the same email already exists in Salesforce.
fmdbsfdc_createLeadAction.duplicateStrategy.create=Always create a new lead
fmdbsfdc_createLeadAction.duplicateStrategy.upsertByEmail=Update the existing lead with the same email
fmdbsfdc_createLeadAction.failSubmissionOnError=Fail the submission when Salesforce rejects the lead
fmdbsfdc_createLeadAction.failSubmissionOnError.ui.tooltip=When enabled, a Salesforce error makes the form submission fail and the visitor sees an error. When disabled, the error is only logged and the submission succeeds.
fmdbsfdc.section.salesforce=Salesforce
