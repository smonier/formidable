fmdbsfdc_createLeadAction=Cr\u00e9er un Lead Salesforce
fmdbsfdc_createLeadAction.ui.tooltip=Cr\u00e9e un Lead dans Salesforce \u00e0 partir des valeurs soumises. Associez chaque champ du Lead Salesforce \u00e0 un champ du formulaire ou \u00e0 une valeur constante.
fmdbsfdc_createLeadAction.connectionId=Connexion Salesforce
fmdbsfdc_createLeadAction.connectionId.ui.tooltip=Organisation Salesforce vers laquelle le lead est envoy\u00e9. La liste des connexions est g\u00e9r\u00e9e par un administrateur dans la configuration du module.
fmdbsfdc_createLeadAction.fieldMapping=Correspondance des champs du Lead
fmdbsfdc_createLeadAction.fieldMapping.ui.tooltip=Pour chaque champ du Lead Salesforce, choisissez le champ du formulaire dont la valeur est envoy\u00e9e, ou saisissez une valeur constante. Nom et Soci\u00e9t\u00e9 sont obligatoires dans Salesforce.
fmdbsfdc_createLeadAction.duplicateStrategy=Gestion des doublons
fmdbsfdc_createLeadAction.duplicateStrategy.ui.tooltip=Comportement lorsqu'un lead avec la m\u00eame adresse e-mail existe d\u00e9j\u00e0 dans Salesforce.
fmdbsfdc_createLeadAction.duplicateStrategy.create=Toujours cr\u00e9er un nouveau lead
fmdbsfdc_createLeadAction.duplicateStrategy.upsertByEmail=Mettre \u00e0 jour le lead existant ayant la m\u00eame adresse e-mail
fmdbsfdc_createLeadAction.failSubmissionOnError=Faire \u00e9chouer la soumission si Salesforce rejette le lead
fmdbsfdc_createLeadAction.failSubmissionOnError.ui.tooltip=Si activ\u00e9, une erreur Salesforce fait \u00e9chouer la soumission du formulaire et le visiteur voit un message d'erreur. Si d\u00e9sactiv\u00e9, l'erreur est seulement journalis\u00e9e et la soumission r\u00e9ussit.
