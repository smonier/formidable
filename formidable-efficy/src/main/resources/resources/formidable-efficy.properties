fmdbeff_createOpportunityAction=Create Efficy Opportunity
fmdbeff_createOpportunityAction.ui.tooltip=Creates an Opportunity in Efficy e-deal from the submitted values. Map each Efficy field to a form field, a constant, the submission date, or the Efficy person found from the submitted email.
fmdbeff_createOpportunityAction.connectionId=Efficy connection
fmdbeff_createOpportunityAction.connectionId.ui.tooltip=Efficy tenant to send the opportunity to. The list of connections is managed by an administrator in the module configuration.
fmdbeff_createOpportunityAction.fieldMapping=Opportunity field mapping
fmdbeff_createOpportunityAction.fieldMapping.ui.tooltip=For each Efficy field, choose the form field whose value is sent, a constant, the submission date, or the person lookup by email. Fields marked with an asterisk are required by Efficy.
fmdbeff_createOpportunityAction.failSubmissionOnError=Fail the submission when Efficy rejects the opportunity
fmdbeff_createOpportunityAction.failSubmissionOnError.ui.tooltip=When enabled, an Efficy error makes the form submission fail and the visitor sees an error. When disabled, the error is only logged and the submission succeeds.
fmdbeff.section.efficy=Efficy
