fmdbeff_createOpportunityAction=Cr\u00e9er une opportunit\u00e9 Efficy
fmdbeff_createOpportunityAction.ui.tooltip=Cr\u00e9e une opportunit\u00e9 dans Efficy e-deal \u00e0 partir des valeurs soumises. Associez chaque champ Efficy \u00e0 un champ du formulaire, une constante, la date de soumission ou la personne Efficy retrouv\u00e9e par l'e-mail saisi.
fmdbeff_createOpportunityAction.connectionId=Connexion Efficy
fmdbeff_createOpportunityAction.connectionId.ui.tooltip=Instance Efficy vers laquelle l'opportunit\u00e9 est envoy\u00e9e. La liste des connexions est g\u00e9r\u00e9e par un administrateur dans la configuration du module.
fmdbeff_createOpportunityAction.fieldMapping=Correspondance des champs de l'opportunit\u00e9
fmdbeff_createOpportunityAction.fieldMapping.ui.tooltip=Pour chaque champ Efficy, choisissez le champ du formulaire dont la valeur est envoy\u00e9e, une constante, la date de soumission ou la recherche de personne par e-mail. Les champs marqu\u00e9s d'un ast\u00e9risque sont obligatoires dans Efficy.
fmdbeff_createOpportunityAction.failSubmissionOnError=Faire \u00e9chouer la soumission si Efficy rejette l'opportunit\u00e9
fmdbeff_createOpportunityAction.failSubmissionOnError.ui.tooltip=Si activ\u00e9, une erreur Efficy fait \u00e9chouer la soumission du formulaire et le visiteur voit un message d'erreur. Si d\u00e9sactiv\u00e9, l'erreur est seulement journalis\u00e9e et la soumission r\u00e9ussit.
fmdbeff.section.efficy=Efficy
