fmdb_inputFile.multiple=Fichiers multiples
fmdb_inputFile.multiple.ui.tooltip=Permettre de sélectionner plusieurs fichiers à la fois.<br/><b>Utilisation :</b> <i>Active la sélection multiple dans le sélecteur de fichiers</i>.<br/><b>Note :</b> <i>Fait évoluer la structure des données en tableau</i>.
fmdb_inputFile.required=Obligatoire
fmdb_inputFile.required.ui.tooltip=Rend ce champ fichier obligatoire pour l'envoi.<br/><b>Validation :</b> Au moins un fichier doit être sélectionné.
fmdb_inputEmail=Champ e-mail
fmdb_inputEmail.ui.tooltip=Un champ e-mail avec validation native et clavier optimisé mobile.
fmdb_inputEmail.helpText=Aide à la saisie
fmdb_inputEmail.helpText.ui.tooltip=Message affiché sous le libellé du champ pour aider l'utilisateur à le remplir.<br/><b>Accessibilité :</b> <i>Annoncé par les lecteurs d'écran via aria-describedby</i>.
fmdb_inputEmail.placeholder=Texte indicatif
fmdb_inputEmail.placeholder.ui.tooltip=Texte affiché dans le champ e-mail lorsqu'il est vide.<br/><b>Utilisation :</b> <i>Fournit des indices/exemples pour la saisie d'e-mail</i>.<br/><b>Exemple :</b> <i>[user@example.com](mailto:user@example.com)</i>.<br/><b>Mode multiple :</b> <i>[user1@example.com](mailto:user1@example.com), [user2@example.com](mailto:user2@example.com)</i>.
fmdb_inputEmail.defaultValue=Valeur par défaut
fmdb_inputEmail.defaultValue.ui.tooltip=Adresse e-mail préremplie affichée au premier rendu.<br/><b>Utilisation :</b> <i>Définir un contenu initial ou des valeurs suggérées</i>.
fmdb_inputEmail.minLength=Longueur minimale
fmdb_inputEmail.minLength.ui.tooltip=Nombre minimum de caractères requis pour ce champ e-mail.<br/><b>Validation :</b> Empêche l'envoi avec des adresses trop courtes.
fmdb_inputEmail.maxLength=Longueur maximale
fmdb_inputEmail.maxLength.ui.tooltip=Nombre maximum de caractères autorisés pour ce champ.<br/><b>Validation :</b> Empêche la saisie au-delà de la limite.<br/><b>Note :</b> <i>Doit être supérieur à minLength si les deux sont définis</i>.
fmdb_inputEmail.multiple=E-mails multiples
fmdb_inputEmail.multiple.ui.tooltip=Permettre de saisir plusieurs adresses séparées par des virgules.<br/><b>Utilisation :</b> <i>Utile pour destinataires/notifications multiples</i>.<br/><b>Exemple :</b> <i>[user1@example.com](mailto:user1@example.com), [user2@example.com](mailto:user2@example.com)</i>.
fmdb_inputEmail.autocomplete=Autocomplétion
fmdb_inputEmail.autocomplete.ui.tooltip=Activer l'autocomplétion du navigateur pour ce champ e-mail.<br/><b>Utilisation :</b><br/>- <b>on</b> : <i>Active l'autocomplétion du navigateur (par défaut)</i><br/>- <b>off</b> : <i>Désactive l'autocomplétion</i><br/>- <b>Valeur libre</b> : <i>N'importe quel token HTML5 autocomplete (ex : 'email', 'email-client')</i>.
fmdb_inputEmail.list=Liste d'e-mails suggérés
fmdb_inputEmail.list.ui.tooltip=Liste d'adresses prédéfinies pour l'autocomplétion.<br/><b>Utilisation :</b> <i>Propose des e-mails dans un menu déroulant</i>.<br/><b>Exemple :</b> <i>[admin@company.com](mailto:admin@company.com), [support@company.com](mailto:support@company.com)</i>.
fmdb_inputEmail.pattern=Motif e-mail
fmdb_inputEmail.pattern.ui.tooltip=Regex personnalisée pour une validation au-delà du format standard.<br/><b>Utilisation :</b> <i>Restreindre à des domaines ou formats spécifiques</i>.<br/><b>Exemple :</b> <i>.*@company.com pour n'accepter que les e-mails d'entreprise</i>.<br/><b>Note :</b> <i>Fonctionne en plus de la validation native</i>.
fmdb_inputEmail.required=Obligatoire
fmdb_inputEmail.required.ui.tooltip=Rend ce champ e-mail obligatoire.<br/><b>Validation :</b> Empêche l'envoi si vide et valide le format.
fmdb_inputColor=Champ couleur
fmdb_inputColor.ui.tooltip=Un champ de sélection de couleur ouvrant l'interface native.
fmdb_inputColor.helpText=Aide à la saisie
fmdb_inputColor.helpText.ui.tooltip=Message affiché sous le libellé du champ pour aider l'utilisateur à le remplir.<br/><b>Accessibilité :</b> <i>Annoncé par les lecteurs d'écran via aria-describedby</i>.
fmdb_inputColor.defaultValue=Valeur de couleur par défaut
fmdb_inputColor.defaultValue.ui.tooltip=Le format dépend de l'espace colorimétrique.<br/><b>limited-sRGB :</b> <i>Hex (#RRGGBB ou #RRGGBBAA)</i>.<br/><b>Display-P3 :</b> <i>Hex ou CSS color(display-p3 r g b)</i>.<br/><b>Exemple :</b> <i>#FF0000, color(display-p3 1 0 0)</i>.
fmdb_inputColor.required=Obligatoire
fmdb_inputColor.required.ui.tooltip=Rend ce champ couleur obligatoire.<br/><b>Validation :</b> Empêche l'envoi si vide.<br/><b>Note :</b> <i>Le champ couleur a toujours une valeur ; impact surtout sémantique</i>.
#fmdb_inputColorAdvancedSettings=Paramètres avancés de couleur
#fmdb_inputColorAdvancedSettings.ui.tooltip=Paramètres avancés pour le sélecteur de couleur.<br/><b>Compatibilité :</b> <i>Non pris en charge par tous les navigateurs - surtout Safari et iOS</i>.<br/><b>Note :</b> <i>Repli vers le comportement standard si non supporté</i>.
#fmdb_inputColorAdvancedSettings.alpha=Canal alpha
