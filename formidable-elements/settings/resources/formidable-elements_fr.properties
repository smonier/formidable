fmdb_inputFile.helpText.ui.tooltip=Message affiché sous le libellé du champ pour aider l'utilisateur à le remplir.<br/><b>Accessibilité :</b> <i>Annoncé par les lecteurs d'écran via aria-describedby</i>.
