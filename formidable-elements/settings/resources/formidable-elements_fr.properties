fmdbmix_component=Formidable - Éléments de formulaire

fmdb_actionList=Actions du formulaire
fmdb_actionList.ui.tooltip=Liste des actions exécutées à la soumission du formulaire, dans l'ordre défini.
fmdb_inputText=Champ texte
fmdb_inputText.ui.tooltip=Un champ de saisie sur une seule ligne.
fmdb_inputText.helpText=Aide à la saisie
fmdb_inputText.helpText.ui.tooltip=Message affiché sous le libellé du champ pour aider l'utilisateur à le remplir.<br/><b>Accessibilité :</b> <i>Annoncé par les lecteurs d'écran via aria-describedby</i>.
fmdb_inputText.placeholder=Texte indicatif
fmdb_inputText.placeholder.ui.tooltip=Texte affiché dans le champ lorsqu'il est vide.<br/><b>Utilisation :</b> <i>Fournit des indices ou des exemples pour guider la saisie</i>.
fmdb_inputText.defaultValue=Valeur par défaut
fmdb_inputText.defaultValue.ui.tooltip=Valeur préremplie affichée lors du premier rendu du champ.<br/><b>Utilisation :</b> <i>Définir un contenu initial ou des valeurs suggérées</i>.
fmdb_inputText.minLength=Longueur minimale
fmdb_inputText.minLength.ui.tooltip=Nombre minimum de caractères requis pour ce champ.<br/><b>Validation :</b> Empêche l'envoi du formulaire avec des valeurs plus courtes que spécifié.
fmdb_inputText.maxLength=Longueur maximale
fmdb_inputText.maxLength.ui.tooltip=Nombre maximum de caractères autorisés dans ce champ.<br/><b>Validation :</b> Empêche la saisie de plus de caractères que spécifié.<br/><b>Note :</b> <i>Doit être supérieur à minLength si les deux sont définis</i>.
fmdb_inputText.mask=Masque de saisie
fmdb_inputText.mask.ui.tooltip=Masque qui guide le format de saisie. Tout autre caractère est inséré automatiquement comme littéral fixe.<br/><b>Jetons :</b> <i>9 pour un chiffre, A pour une lettre majuscule, a pour une lettre minuscule, X/x pour un alphanumérique (majuscule/minuscule)</i>.<br/><b>Exemple :</b> <i>(999) 999-9999, 99/99/9999, AAA-999</i>.<br/><b>Note :</b> <i>Ce n'est pas une expression régulière ; utilisez Validation par motif pour une validation par regex</i>.
fmdb_inputText.list=Liste de valeurs suggérées
fmdb_inputText.list.ui.tooltip=Liste de valeurs prédéfinies pour les suggestions d'autocomplétion.<br/><b>Utilisation :</b> <i>Propose des options dans un menu déroulant</i>.
fmdb_inputText.required=Obligatoire
fmdb_inputText.required.ui.tooltip=Rend ce champ obligatoire pour l'envoi du formulaire.<br/><b>Validation :</b> Empêche l'envoi si le champ est vide.
fmdb_inputDate=Champ date
fmdb_inputDate.ui.tooltip=Un champ de date avec sélecteur natif du navigateur.
fmdb_inputDate.helpText=Aide à la saisie
fmdb_inputDate.helpText.ui.tooltip=Message affiché sous le libellé du champ pour aider l'utilisateur à le remplir.<br/><b>Accessibilité :</b> <i>Annoncé par les lecteurs d'écran via aria-describedby</i>.
fmdb_inputDate.defaultValue=Valeur par défaut
fmdb_inputDate.defaultValue.ui.tooltip=Date préremplie affichée lors du premier rendu du champ.<br/><b>Utilisation :</b> <i>Définir une date initiale ou des valeurs suggérées via le sélecteur</i>.
fmdb_inputDate.step=Pas
fmdb_inputDate.step.ui.tooltip=Nombre de jours entre les dates valides.<br/><b>Utilisation :</b> <i>1 pour quotidien, 7 pour hebdomadaire</i>.<br/><b>Note :</b> <i>Par défaut : 1 jour</i>.
fmdb_inputDate.required=Obligatoire
fmdb_inputDate.required.ui.tooltip=Rend ce champ date obligatoire pour l'envoi du formulaire.<br/><b>Validation :</b> Empêche l'envoi si le champ est vide.
fmdb_inputNumber=Champ nombre
fmdb_inputNumber.ui.tooltip=Un champ numérique avec incrémenteur natif du navigateur et clavier numérique sur mobile.
fmdb_inputNumber.helpText=Aide à la saisie
fmdb_inputNumber.helpText.ui.tooltip=Message affiché sous le libellé du champ pour aider l'utilisateur à le remplir.<br/><b>Accessibilité :</b> <i>Annoncé par les lecteurs d'écran via aria-describedby</i>.
fmdb_inputNumber.placeholder=Texte indicatif
fmdb_inputNumber.placeholder.ui.tooltip=Texte affiché dans le champ lorsqu'il est vide.<br/><b>Utilisation :</b> <i>Donne un indice ou un exemple pour guider la saisie</i>.
fmdb_inputNumber.defaultValue=Valeur par défaut
fmdb_inputNumber.defaultValue.ui.tooltip=Nombre prérempli affiché lors du premier rendu du champ.<br/><b>Utilisation :</b> <i>Définir une valeur initiale ou suggérée</i>.
fmdb_inputNumber.minValue=Valeur minimale
fmdb_inputNumber.minValue.ui.tooltip=Le plus petit nombre pouvant être soumis.<br/><b>Validation :</b> Appliquée par le navigateur puis revérifiée côté serveur à l'envoi.
fmdb_inputNumber.maxValue=Valeur maximale
fmdb_inputNumber.maxValue.ui.tooltip=Le plus grand nombre pouvant être soumis.<br/><b>Validation :</b> Appliquée par le navigateur puis revérifiée côté serveur à l'envoi.<br/><b>Note :</b> <i>Doit être supérieure à la valeur minimale si les deux sont définies</i>.
fmdb_inputNumber.step=Pas
fmdb_inputNumber.step.ui.tooltip=Intervalle entre les nombres valides, compté depuis la valeur minimale si elle est définie (depuis 0 sinon).<br/><b>Utilisation :</b> <i>1 pour des entiers, 0.01 pour des montants avec centimes</i>.<br/><b>Note :</b> <i>Par défaut : 1, une réponse décimale nécessite donc un pas décimal explicite</i>.
fmdb_inputNumber.list=Liste de valeurs suggérées
fmdb_inputNumber.list.ui.tooltip=Liste de nombres prédéfinis pour les suggestions de saisie.<br/><b>Utilisation :</b> <i>Propose des options dans un menu déroulant</i>.
fmdb_inputNumber.required=Obligatoire
fmdb_inputNumber.required.ui.tooltip=Rend ce champ nombre obligatoire pour l'envoi du formulaire.<br/><b>Validation :</b> Empêche l'envoi si le champ est vide.
fmdbmix_advancedInputNumberSettings=Paramètres avancés
fmdbmix_advancedInputNumberSettings.ui.tooltip=Options avancées pour le comportement/accessibilité du champ nombre.<br/><b>Utilisation :</b> <i>Affiner pour des cas spécifiques</i>.
fmdbmix_advancedInputNumberSettings.title=Titre d'infobulle
fmdbmix_advancedInputNumberSettings.title.ui.tooltip=Texte consultatif affiché par le navigateur au survol.<br/><b>Accessibilité :</b> <i>Ne pas s'y fier seul ; préférer l'aide à la saisie pour les informations essentielles</i>.
fmdbmix_advancedInputNumberSettings.readonly=Lecture seule
fmdbmix_advancedInputNumberSettings.readonly.ui.tooltip=Rendre le champ en lecture seule tout en restant focusable.<br/><b>Utilisation :</b> <i>Afficher du contenu sélectionnable non modifiable</i>.<br/><b>Note :</b> <i>Inclus dans l'envoi, contrairement aux champs désactivés</i>.
fmdbmix_advancedInputNumberSettings.autofocus=Focus automatique
fmdbmix_advancedInputNumberSettings.autofocus.ui.tooltip=Focaliser automatiquement au chargement de la page.<br/><b>Utilisation :</b> <i>Améliore l'accessibilité</i>.<br/><b>Note :</b> <i>Un seul élément par page</i>.
fmdbmix_advancedInputNumberSettings.disabled=Désactivé
fmdbmix_advancedInputNumberSettings.disabled.ui.tooltip=Désactiver le champ pour empêcher l'interaction.<br/><b>Utilisation :</b> <i>Lecture seule et exclusion de la soumission</i>.<br/><b>Note :</b> <i>Les champs désactivés ne sont pas soumis</i>.
fmdbmix_advancedInputNumberSettings.form=Formulaire associé
fmdbmix_advancedInputNumberSettings.form.ui.tooltip=ID du formulaire auquel appartient ce champ.<br/><b>Utilisation :</b> <i>Associer un champ situé ailleurs sur la page</i>.<br/><b>Note :</b> <i>Permet d'être en dehors de l'élément form</i>.
fmdb_inputRange=Champ curseur
fmdb_inputRange.ui.tooltip=Un curseur pour choisir un nombre dans un intervalle.<br/><b>Note :</b> <i>Rien n'est soumis tant que le visiteur n'interagit pas avec le curseur : un champ non touché reste sans réponse</i>.
fmdb_inputRange.helpText=Aide à la saisie
fmdb_inputRange.helpText.ui.tooltip=Message affiché sous le libellé du champ pour aider l'utilisateur à le remplir.<br/><b>Accessibilité :</b> <i>Annoncé par les lecteurs d'écran via aria-describedby</i>.
fmdb_inputRange.defaultValue=Valeur par défaut
fmdb_inputRange.defaultValue.ui.tooltip=Position initiale du curseur.<br/><b>Note :</b> <i>Si définie, le champ démarre répondu avec cette valeur ; laisser vide pour que le visiteur doive interagir avec le curseur pour que le champ compte comme répondu</i>.
fmdb_inputRange.minValue=Valeur minimale
fmdb_inputRange.minValue.ui.tooltip=La valeur à l'extrémité gauche du curseur.<br/><b>Validation :</b> Appliquée par le navigateur puis revérifiée côté serveur à l'envoi.
fmdb_inputRange.maxValue=Valeur maximale
fmdb_inputRange.maxValue.ui.tooltip=La valeur à l'extrémité droite du curseur.<br/><b>Validation :</b> Appliquée par le navigateur puis revérifiée côté serveur à l'envoi.<br/><b>Note :</b> <i>Doit être supérieure à la valeur minimale</i>.
fmdb_inputRange.step=Pas
fmdb_inputRange.step.ui.tooltip=Intervalle entre les valeurs sélectionnables, compté depuis la valeur minimale.<br/><b>Utilisation :</b> <i>1 pour des entiers, 0.5 pour des scores en demi-points</i>.<br/><b>Note :</b> <i>Par défaut : 1</i>.
fmdb_inputRange.minLabel=Libellé de gauche
fmdb_inputRange.minLabel.ui.tooltip=Texte court affiché à l'extrémité minimale du curseur.<br/><b>Exemple :</b> <i>Pas du tout probable</i>.
fmdb_inputRange.maxLabel=Libellé de droite
fmdb_inputRange.maxLabel.ui.tooltip=Texte court affiché à l'extrémité maximale du curseur.<br/><b>Exemple :</b> <i>Extrêmement probable</i>.
fmdb_inputRange.list=Valeurs des graduations
fmdb_inputRange.list.ui.tooltip=Nombres affichés comme graduations le long du curseur.<br/><b>Utilisation :</b> <i>Donner des repères visuels, par ex. 0, 5, 10</i>.
fmdb_inputRange.required=Obligatoire
fmdb_inputRange.required.ui.tooltip=Rend ce curseur obligatoire pour l'envoi du formulaire.<br/><b>Validation :</b> Empêche l'envoi tant que le visiteur n'a pas interagi avec le curseur.
fmdbmix_advancedInputRangeSettings=Paramètres avancés
fmdbmix_advancedInputRangeSettings.ui.tooltip=Options avancées pour le comportement/accessibilité du curseur.<br/><b>Utilisation :</b> <i>Affiner pour des cas spécifiques</i>.
fmdbmix_advancedInputRangeSettings.title=Titre d'infobulle
fmdbmix_advancedInputRangeSettings.title.ui.tooltip=Texte consultatif affiché par le navigateur au survol.<br/><b>Accessibilité :</b> <i>Ne pas s'y fier seul ; préférer l'aide à la saisie pour les informations essentielles</i>.
fmdbmix_advancedInputRangeSettings.autofocus=Focus automatique
fmdbmix_advancedInputRangeSettings.autofocus.ui.tooltip=Focaliser automatiquement au chargement de la page.<br/><b>Utilisation :</b> <i>Améliore l'accessibilité</i>.<br/><b>Note :</b> <i>Un seul élément par page</i>.
fmdbmix_advancedInputRangeSettings.disabled=Désactivé
fmdbmix_advancedInputRangeSettings.disabled.ui.tooltip=Désactiver le curseur pour empêcher l'interaction.<br/><b>Utilisation :</b> <i>Lecture seule et exclusion de la soumission</i>.<br/><b>Note :</b> <i>Les champs désactivés ne sont pas soumis</i>.
fmdbmix_advancedInputRangeSettings.form=Formulaire associé
fmdbmix_advancedInputRangeSettings.form.ui.tooltip=ID du formulaire auquel appartient ce champ.<br/><b>Utilisation :</b> <i>Associer un champ situé ailleurs sur la page</i>.<br/><b>Note :</b> <i>Permet d'être en dehors de l'élément form</i>.
fmdb_checkbox=Champ cases à cocher
fmdb_checkbox.ui.tooltip=Un champ de cases à cocher. Affiche une case unique si une seule option est définie, ou un groupe de cases si plusieurs options sont disponibles.
fmdb_checkbox.helpText=Aide à la saisie
fmdb_checkbox.helpText.ui.tooltip=Message affiché sous le libellé du champ pour aider l'utilisateur à le remplir.<br/><b>Accessibilité :</b> <i>Annoncé par les lecteurs d'écran via aria-describedby</i>.
fmdb_checkbox.required=Obligatoire
fmdb_checkbox.required.ui.tooltip=Rend ce champ obligatoire pour l'envoi du formulaire.<br/><b>Option unique :</b> La case doit être cochée.<br/><b>Options multiples :</b> Au moins une case doit être cochée.
fmdb_radio=Champ boutons radio
fmdb_radio.ui.tooltip=Un champ de boutons radio. Affiche un bouton unique si une seule option est définie, ou un groupe de boutons si plusieurs options sont disponibles.
fmdb_radio.helpText=Aide à la saisie
fmdb_radio.helpText.ui.tooltip=Message affiché sous le libellé du champ pour aider l'utilisateur à le remplir.<br/><b>Accessibilité :</b> <i>Annoncé par les lecteurs d'écran via aria-describedby</i>.
fmdb_radio.required=Obligatoire
fmdb_radio.required.ui.tooltip=Rend ce champ obligatoire pour l'envoi du formulaire.<br/><b>Option unique :</b> Le bouton radio doit être sélectionné.<br/><b>Options multiples :</b> Un bouton radio du groupe doit être sélectionné.
fmdb_select=Champ liste déroulante
fmdb_select.ui.tooltip=Un champ de sélection avec options prédéfinies.
fmdb_select.helpText=Aide à la saisie
fmdb_select.helpText.ui.tooltip=Message affiché sous le libellé du champ pour aider l'utilisateur à le remplir.<br/><b>Accessibilité :</b> <i>Annoncé par les lecteurs d'écran via aria-describedby</i>.
fmdb_select.multiple=Sélection multiple
fmdb_select.multiple.ui.tooltip=Permettre de sélectionner plusieurs options.<br/><b>Utilisation :</b> <i>Maintenir Ctrl/Cmd pour sélectionner plusieurs éléments</i>.<br/><b>Note :</b> <i>Fait évoluer la structure des données en tableau</i>.
fmdb_select.optionsEmptyLabel=Libellé de l'option vide
fmdb_select.optionsEmptyLabel.ui.tooltip=Si rempli, une option vide portant ce libellé (par ex. « Sélectionnez une catégorie… ») est affichée en premier : le champ est vide par défaut au lieu de présélectionner la première option.<br/><b>Note :</b> <i>le caractère obligatoire d'une liste déroulante n'est vérifiable par le visiteur que si une telle option vide existe</i>.
fmdb_select.size=Nombre d'options visibles
fmdb_select.size.ui.tooltip=Nombre d'options visibles simultanément.<br/><b>Utilisation :</b> <i>Affiche une liste défilante au lieu d'un menu déroulant si > 1</i>.<br/><b>Note :</b> <i>N'affecte que l'affichage, pas la fonctionnalité</i>.
fmdb_select.autofocus=Focus automatique
fmdb_select.autofocus.ui.tooltip=Focaliser automatiquement cette liste au chargement de la page.<br/><b>Utilisation :</b> <i>Améliore l'accessibilité et l'expérience utilisateur</i>.<br/><b>Note :</b> <i>Un seul élément par page doit avoir l'autofocus</i>.
fmdb_select.required=Obligatoire
fmdb_select.required.ui.tooltip=Rend cette liste obligatoire pour l'envoi du formulaire.<br/><b>Validation :</b> Empêche l'envoi si aucune option n'est sélectionnée.
fmdb_select.disabled=Désactivé
fmdb_select.disabled.ui.tooltip=Désactiver la liste déroulante pour empêcher toute interaction.<br/><b>Utilisation :</b> <i>Rend le champ en lecture seule et l'exclut de l'envoi du formulaire</i>.<br/><b>Note :</b> <i>Les champs désactivés ne sont pas soumis avec les données du formulaire</i>.
fmdb_fieldset=Bloc groupe de champs
fmdb_fieldset.ui.tooltip=Un élément fieldset qui regroupe des champs liés.<br/><b>Utilisation :</b> <i>Organise les éléments du formulaire sémantiquement et visuellement</i>.<br/><b>Note :</b> <i>Peut contenir n'importe quels éléments de formulaire</i>.
fmdb_richText=Bloc texte riche
fmdb_richText.ui.tooltip=Un bloc de texte riche intégrable dans un formulaire.<br/><b>Utilisation :</b> <i>Ajoutez du texte formaté, des instructions ou du contenu HTML dans un formulaire</i>.
