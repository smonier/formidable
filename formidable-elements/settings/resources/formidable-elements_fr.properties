fmdb_inputFile.accept.ui.tooltip=Sélectionne les types MIME acceptés par le serveur pour les fichiers téléversés.<br/><b>Utilisation :</b> <i>Choisir un ou plusieurs types de fichiers autorisés dans la liste</i>.<br/><b>Note :</b> <i>Les options disponibles proviennent de la configuration serveur</i>.
