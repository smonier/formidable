fmdbmix_component=Formidable - Elementos de formulario

fmdb_actionList=Acciones del formulario
fmdb_actionList.ui.tooltip=Lista de acciones ejecutadas al enviar el formulario, en orden.
fmdb_inputText=Campo Texto
fmdb_inputText.ui.tooltip=Un campo de entrada de texto de una sola línea.
fmdb_inputText.helpText=Ayuda de entrada
fmdb_inputText.helpText.ui.tooltip=Indicación mostrada bajo la etiqueta del campo para ayudar a rellenarlo.<br/><b>Accesibilidad:</b> <i>Anunciada por los lectores de pantalla mediante aria-describedby</i>.
fmdb_inputText.placeholder=Texto de ejemplo
fmdb_inputText.placeholder.ui.tooltip=Texto mostrado dentro del campo cuando está vacío.<br/><b>Uso:</b> <i>Ofrece pistas o ejemplos para guiar la entrada</i>.
fmdb_inputText.defaultValue=Valor por defecto
fmdb_inputText.defaultValue.ui.tooltip=Valor prerrellenado que aparece al mostrar el campo por primera vez.<br/><b>Uso:</b> <i>Definir un contenido inicial o valores sugeridos</i>.
fmdb_inputText.minLength=Longitud mínima
fmdb_inputText.minLength.ui.tooltip=Número mínimo de caracteres requeridos en este campo.<br/><b>Validación:</b> Impide enviar el formulario con valores más cortos.
fmdb_inputText.maxLength=Longitud máxima
fmdb_inputText.maxLength.ui.tooltip=Número máximo de caracteres permitidos en este campo.<br/><b>Validación:</b> Impide introducir más caracteres de los indicados.<br/><b>Nota:</b> <i>Debe ser mayor que minLength si ambos están definidos</i>.
fmdb_inputText.mask=Máscara de entrada
fmdb_inputText.mask.ui.tooltip=Máscara que guía el formato de entrada. Cualquier otro carácter se inserta automáticamente como literal fijo.<br/><b>Comodines:</b> <i>9 para un dígito, A para una letra mayúscula, a para una letra minúscula, X/x para un alfanumérico (mayúscula/minúscula)</i>.<br/><b>Ejemplo:</b> <i>(999) 999-9999, 99/99/9999, AAA-999</i>.<br/><b>Nota:</b> <i>No es una expresión regular; use la validación por patrón para validaciones basadas en regex</i>.
fmdb_inputText.list=Lista de valores sugeridos
fmdb_inputText.list.ui.tooltip=Lista de valores predefinidos para las sugerencias de autocompletado.<br/><b>Uso:</b> <i>Ofrece opciones sugeridas en un menú desplegable</i>.
fmdb_inputText.required=Obligatorio
fmdb_inputText.required.ui.tooltip=Hace este campo obligatorio para enviar el formulario.<br/><b>Validación:</b> Impide el envío cuando el campo está vacío.
fmdb_inputDate=Campo Fecha
fmdb_inputDate.ui.tooltip=Un campo de fecha con el selector de fecha nativo del navegador.
fmdb_inputDate.helpText=Ayuda de entrada
fmdb_inputDate.helpText.ui.tooltip=Indicación mostrada bajo la etiqueta del campo para ayudar a rellenarlo.<br/><b>Accesibilidad:</b> <i>Anunciada por los lectores de pantalla mediante aria-describedby</i>.
fmdb_inputDate.defaultValue=Valor por defecto
fmdb_inputDate.defaultValue.ui.tooltip=Fecha prerrellenada que aparece al mostrar el campo por primera vez.<br/><b>Uso:</b> <i>Definir una fecha inicial o valores sugeridos con el selector de fecha</i>.
fmdb_inputDate.step=Paso
fmdb_inputDate.step.ui.tooltip=Número de días entre fechas válidas.<br/><b>Uso:</b> <i>1 para diario, 7 para intervalos semanales</i>.<br/><b>Nota:</b> <i>El valor por defecto es 1 día</i>.
fmdb_inputDate.required=Obligatorio
fmdb_inputDate.required.ui.tooltip=Hace este campo de fecha obligatorio para enviar el formulario.<br/><b>Validación:</b> Impide el envío cuando el campo está vacío.
fmdb_inputNumber=Campo Número
fmdb_inputNumber.ui.tooltip=Un campo numérico con el control giratorio nativo del navegador y teclado numérico en móviles.
fmdb_inputNumber.helpText=Ayuda de entrada
fmdb_inputNumber.helpText.ui.tooltip=Indicación mostrada bajo la etiqueta del campo para ayudar a rellenarlo.<br/><b>Accesibilidad:</b> <i>Anunciada por los lectores de pantalla mediante aria-describedby</i>.
fmdb_inputNumber.placeholder=Texto de ejemplo
fmdb_inputNumber.placeholder.ui.tooltip=Texto mostrado dentro del campo cuando está vacío.<br/><b>Uso:</b> <i>Ofrece pistas o ejemplos para guiar la entrada</i>.
fmdb_inputNumber.defaultValue=Valor por defecto
fmdb_inputNumber.defaultValue.ui.tooltip=Número prerrellenado que aparece al mostrar el campo por primera vez.<br/><b>Uso:</b> <i>Definir un valor inicial o sugerido</i>.
fmdb_inputNumber.minValue=Valor mínimo
fmdb_inputNumber.minValue.ui.tooltip=El número más pequeño que se puede enviar.<br/><b>Validación:</b> Aplicada por el navegador y de nuevo en el servidor al enviar.
fmdb_inputNumber.maxValue=Valor máximo
fmdb_inputNumber.maxValue.ui.tooltip=El número más grande que se puede enviar.<br/><b>Validación:</b> Aplicada por el navegador y de nuevo en el servidor al enviar.<br/><b>Nota:</b> <i>Debe ser mayor que el valor mínimo si ambos están definidos</i>.
fmdb_inputNumber.step=Paso
fmdb_inputNumber.step.ui.tooltip=Intervalo entre números válidos, contado desde el valor mínimo si está definido (desde 0 en caso contrario).<br/><b>Uso:</b> <i>1 para enteros, 0.01 para importes con céntimos</i>.<br/><b>Nota:</b> <i>El valor por defecto es 1, así que las respuestas decimales necesitan un paso decimal explícito</i>.
fmdb_inputNumber.list=Lista de valores sugeridos
fmdb_inputNumber.list.ui.tooltip=Lista de números predefinidos para las sugerencias de autocompletado.<br/><b>Uso:</b> <i>Ofrece opciones sugeridas en un menú desplegable</i>.
fmdb_inputNumber.required=Obligatorio
fmdb_inputNumber.required.ui.tooltip=Hace este campo numérico obligatorio para enviar el formulario.<br/><b>Validación:</b> Impide el envío cuando el campo está vacío.
fmdbmix_advancedInputNumberSettings=Ajustes avanzados
fmdbmix_advancedInputNumberSettings.ui.tooltip=Opciones avanzadas de configuración para el comportamiento y la accesibilidad del campo numérico.<br/><b>Uso:</b> <i>Ajuste fino para casos de uso específicos</i>.
fmdbmix_advancedInputNumberSettings.title=Título del tooltip
fmdbmix_advancedInputNumberSettings.title.ui.tooltip=Texto de aviso que el navegador muestra como tooltip al pasar el ratón.<br/><b>Accesibilidad:</b> <i>No confíe solo en él; prefiera la ayuda de entrada para las indicaciones esenciales</i>.
fmdbmix_advancedInputNumberSettings.readonly=Solo lectura
fmdbmix_advancedInputNumberSettings.readonly.ui.tooltip=Hace el campo de solo lectura pero aún enfocable.<br/><b>Uso:</b> <i>Mostrar contenido que se puede seleccionar/copiar pero no modificar</i>.<br/><b>Nota:</b> <i>Los campos de solo lectura se incluyen en el envío, a diferencia de los deshabilitados</i>.
fmdbmix_advancedInputNumberSettings.autofocus=Foco automático
fmdbmix_advancedInputNumberSettings.autofocus.ui.tooltip=Enfoca automáticamente este campo al cargar la página.<br/><b>Uso:</b> <i>Mejora la accesibilidad y la experiencia de usuario</i>.<br/><b>Nota:</b> <i>Solo un elemento por página debería tener foco automático</i>.
fmdbmix_advancedInputNumberSettings.disabled=Deshabilitado
fmdbmix_advancedInputNumberSettings.disabled.ui.tooltip=Deshabilita el campo impidiendo la interacción del usuario.<br/><b>Uso:</b> <i>Hacer el campo de solo lectura y excluirlo del envío</i>.<br/><b>Nota:</b> <i>Los campos deshabilitados no se envían con los datos del formulario</i>.
fmdbmix_advancedInputNumberSettings.form=Formulario asociado
fmdbmix_advancedInputNumberSettings.form.ui.tooltip=ID del formulario al que pertenece este campo.<br/><b>Uso:</b> <i>Asociar el campo a un formulario situado en otra parte de la página</i>.<br/><b>Nota:</b> <i>Permite que el campo esté fuera del elemento formulario y siga formando parte de él</i>.
fmdb_inputRange=Campo Deslizador
fmdb_inputRange.ui.tooltip=Un deslizador para elegir un número dentro de un rango.<br/><b>Nota:</b> <i>No se envía nada hasta que el visitante interactúa con el deslizador; un campo sin tocar queda sin respuesta</i>.
fmdb_inputRange.helpText=Ayuda de entrada
fmdb_inputRange.helpText.ui.tooltip=Indicación mostrada bajo la etiqueta del campo para ayudar a rellenarlo.<br/><b>Accesibilidad:</b> <i>Anunciada por los lectores de pantalla mediante aria-describedby</i>.
fmdb_inputRange.defaultValue=Valor por defecto
fmdb_inputRange.defaultValue.ui.tooltip=Posición inicial del deslizador.<br/><b>Nota:</b> <i>Si se define, el campo empieza respondido con este valor; déjelo vacío para que el visitante tenga que interactuar con el deslizador para que el campo cuente como respondido</i>.
fmdb_inputRange.minValue=Valor mínimo
fmdb_inputRange.minValue.ui.tooltip=El valor en el extremo izquierdo del deslizador.<br/><b>Validación:</b> Aplicada por el navegador y de nuevo en el servidor al enviar.
fmdb_inputRange.maxValue=Valor máximo
fmdb_inputRange.maxValue.ui.tooltip=El valor en el extremo derecho del deslizador.<br/><b>Validación:</b> Aplicada por el navegador y de nuevo en el servidor al enviar.<br/><b>Nota:</b> <i>Debe ser mayor que el valor mínimo</i>.
fmdb_inputRange.step=Paso
fmdb_inputRange.step.ui.tooltip=Intervalo entre valores seleccionables, contado desde el valor mínimo.<br/><b>Uso:</b> <i>1 para enteros, 0.5 para puntuaciones de medio punto</i>.<br/><b>Nota:</b> <i>El valor por defecto es 1</i>.
fmdb_inputRange.minLabel=Etiqueta del extremo izquierdo
fmdb_inputRange.minLabel.ui.tooltip=Texto corto mostrado en el extremo mínimo del deslizador.<br/><b>Ejemplo:</b> <i>Nada probable</i>.
fmdb_inputRange.maxLabel=Etiqueta del extremo derecho
fmdb_inputRange.maxLabel.ui.tooltip=Texto corto mostrado en el extremo máximo del deslizador.<br/><b>Ejemplo:</b> <i>Extremadamente probable</i>.
fmdb_inputRange.list=Valores de las marcas
fmdb_inputRange.list.ui.tooltip=Números representados como marcas a lo largo del deslizador.<br/><b>Uso:</b> <i>Dar puntos de referencia visuales, p. ej. 0, 5, 10</i>.
fmdb_inputRange.required=Obligatorio
fmdb_inputRange.required.ui.tooltip=Hace este deslizador obligatorio para enviar el formulario.<br/><b>Validación:</b> Impide el envío mientras el visitante no haya interactuado con el deslizador.
fmdbmix_advancedInputRangeSettings=Ajustes avanzados
fmdbmix_advancedInputRangeSettings.ui.tooltip=Opciones avanzadas de configuración para el comportamiento y la accesibilidad del deslizador.<br/><b>Uso:</b> <i>Ajuste fino para casos de uso específicos</i>.
fmdbmix_advancedInputRangeSettings.title=Título del tooltip
fmdbmix_advancedInputRangeSettings.title.ui.tooltip=Texto de aviso que el navegador muestra como tooltip al pasar el ratón.<br/><b>Accesibilidad:</b> <i>No confíe solo en él; prefiera la ayuda de entrada para las indicaciones esenciales</i>.
fmdbmix_advancedInputRangeSettings.autofocus=Foco automático
fmdbmix_advancedInputRangeSettings.autofocus.ui.tooltip=Enfoca automáticamente este deslizador al cargar la página.<br/><b>Uso:</b> <i>Mejora la accesibilidad y la experiencia de usuario</i>.<br/><b>Nota:</b> <i>Solo un elemento por página debería tener foco automático</i>.
fmdbmix_advancedInputRangeSettings.disabled=Deshabilitado
fmdbmix_advancedInputRangeSettings.disabled.ui.tooltip=Deshabilita el deslizador impidiendo la interacción del usuario.<br/><b>Uso:</b> <i>Hacer el campo de solo lectura y excluirlo del envío</i>.<br/><b>Nota:</b> <i>Los campos deshabilitados no se envían con los datos del formulario</i>.
fmdbmix_advancedInputRangeSettings.form=Formulario asociado
fmdbmix_advancedInputRangeSettings.form.ui.tooltip=ID del formulario al que pertenece este deslizador.<br/><b>Uso:</b> <i>Asociar el campo a un formulario situado en otra parte de la página</i>.<br/><b>Nota:</b> <i>Permite que el campo esté fuera del elemento formulario y siga formando parte de él</i>.
fmdb_checkbox=Campo Casilla
fmdb_checkbox.ui.tooltip=Un campo de casilla de verificación. Muestra una sola casilla si hay una opción, o un grupo de casillas si hay varias.
fmdb_checkbox.helpText=Ayuda de entrada
fmdb_checkbox.helpText.ui.tooltip=Indicación mostrada bajo la etiqueta del campo para ayudar a rellenarlo.<br/><b>Accesibilidad:</b> <i>Anunciada por los lectores de pantalla mediante aria-describedby</i>.
fmdb_checkbox.required=Obligatorio
fmdb_checkbox.required.ui.tooltip=Hace este campo obligatorio para enviar el formulario.<br/><b>Opción única:</b> La casilla debe estar marcada.<br/><b>Varias opciones:</b> Al menos una casilla debe estar marcada.
fmdb_radio=Campo Radio
fmdb_radio.ui.tooltip=Un campo de tipo radio. Muestra un solo botón si hay una opción, o un grupo de botones si hay varias.
fmdb_radio.helpText=Ayuda de entrada
fmdb_radio.helpText.ui.tooltip=Indicación mostrada bajo la etiqueta del campo para ayudar a rellenarlo.<br/><b>Accesibilidad:</b> <i>Anunciada por los lectores de pantalla mediante aria-describedby</i>.
fmdb_radio.required=Obligatorio
fmdb_radio.required.ui.tooltip=Hace este campo obligatorio para enviar el formulario.<br/><b>Opción única:</b> El botón de radio debe estar seleccionado.<br/><b>Varias opciones:</b> Un botón del grupo debe estar seleccionado.
fmdb_select=Campo Selección
fmdb_select.ui.tooltip=Un campo de selección desplegable con opciones predefinidas.
fmdb_select.helpText=Ayuda de entrada
fmdb_select.helpText.ui.tooltip=Indicación mostrada bajo la etiqueta del campo para ayudar a rellenarlo.<br/><b>Accesibilidad:</b> <i>Anunciada por los lectores de pantalla mediante aria-describedby</i>.
fmdb_select.multiple=Selección múltiple
fmdb_select.multiple.ui.tooltip=Permite seleccionar varias opciones.<br/><b>Uso:</b> <i>Mantenga pulsado Ctrl/Cmd para seleccionar varios elementos</i>.<br/><b>Nota:</b> <i>Cambia la estructura de datos del formulario a un array</i>.
fmdb_select.optionsEmptyLabel=Etiqueta de la opción vacía
fmdb_select.optionsEmptyLabel.ui.tooltip=Si se rellena, se muestra primero una opción vacía con esta etiqueta (p. ej. «Seleccione una categoría…»): el campo empieza vacío en lugar de preseleccionar la primera opción.<br/><b>Nota:</b> <i>los visitantes solo pueden experimentar la validación de obligatoriedad de un desplegable cuando existe tal opción vacía</i>.
fmdb_select.size=Número de opciones visibles
fmdb_select.size.ui.tooltip=Número de opciones visibles a la vez.<br/><b>Uso:</b> <i>Muestra una lista con desplazamiento en lugar de un desplegable cuando es > 1</i>.<br/><b>Nota:</b> <i>Solo afecta a la presentación, no a la funcionalidad</i>.
fmdb_select.autofocus=Foco automático
fmdb_select.autofocus.ui.tooltip=Enfoca automáticamente este campo al cargar la página.<br/><b>Uso:</b> <i>Mejora la accesibilidad y la experiencia de usuario</i>.<br/><b>Nota:</b> <i>Solo un elemento por página debería tener foco automático</i>.
fmdb_select.required=Obligatorio
fmdb_select.required.ui.tooltip=Hace este campo de selección obligatorio para enviar el formulario.<br/><b>Validación:</b> Impide el envío cuando no hay ninguna opción seleccionada.
fmdb_select.disabled=Deshabilitado
fmdb_select.disabled.ui.tooltip=Deshabilita el campo impidiendo la interacción del usuario.<br/><b>Uso:</b> <i>Hacer el campo de solo lectura y excluirlo del envío</i>.<br/><b>Nota:</b> <i>Los campos deshabilitados no se envían con los datos del formulario</i>.
fmdb_fieldset=Bloque Grupo de campos
fmdb_fieldset.ui.tooltip=Un elemento fieldset que agrupa elementos de formulario relacionados.<br/><b>Uso:</b> <i>Organiza los elementos del formulario semántica y visualmente</i>.<br/><b>Nota:</b> <i>Puede contener cualquier elemento de formulario como hijo</i>.
fmdb_richText=Bloque Texto enriquecido
fmdb_richText.ui.tooltip=Un bloque de texto enriquecido integrable en un formulario.<br/><b>Uso:</b> <i>Añadir texto con formato, instrucciones o contenido HTML dentro de un formulario</i>.
fmdb_richText.text=Contenido
fmdb_richText.text.ui.tooltip=Contenido de texto enriquecido mostrado dentro del formulario.<br/><b>Uso:</b> <i>Admite formato HTML, enlaces y medios</i>.
fmdb_inputFile=Campo Archivo
fmdb_inputFile.ui.tooltip=Un campo de subida de archivos que permite a los usuarios seleccionar archivos de su dispositivo.
fmdb_inputFile.helpText=Ayuda de entrada
fmdb_inputFile.helpText.ui.tooltip=Indicación mostrada bajo la etiqueta del campo para ayudar a rellenarlo.<br/><b>Accesibilidad:</b> <i>Anunciada por los lectores de pantalla mediante aria-describedby</i>.
fmdb_inputFile.accept=Tipos aceptados
fmdb_inputFile.accept.ui.tooltip=Seleccione los tipos MIME que el servidor acepta para los archivos subidos.<br/><b>Uso:</b> <i>Elegir uno o varios tipos de archivo permitidos de la lista</i>.<br/><b>Nota:</b> <i>Las opciones disponibles provienen de la configuración del servidor</i>.
fmdb_inputFile.accept.image/jpeg=Imagen JPEG
fmdb_inputFile.accept.image/png=Imagen PNG
fmdb_inputFile.accept.image/gif=Imagen GIF
fmdb_inputFile.accept.image/webp=Imagen WebP
fmdb_inputFile.accept.application/pdf=Documento PDF
fmdb_inputFile.accept.application/msword=Documento Word (.doc)
fmdb_inputFile.accept.application/vnd.openxmlformats-officedocument.wordprocessingml.document=Documento Word (.docx)
fmdb_inputFile.accept.application/vnd.ms-excel=Hoja de cálculo Excel (.xls)
fmdb_inputFile.accept.application/vnd.oasis.opendocument.spreadsheet=Hoja de cálculo OpenDocument (.ods)
fmdb_inputFile.accept.application/vnd.oasis.opendocument.text=Texto OpenDocument (.odt)
fmdb_inputFile.accept.application/vnd.openxmlformats-officedocument.spreadsheetml.sheet=Hoja de cálculo Excel (.xlsx)
fmdb_inputFile.accept.text/plain=Texto sin formato
fmdb_inputFile.accept.text/csv=Archivo CSV
fmdb_inputFile.accept.video/mp4=Vídeo MP4
fmdb_inputFile.accept.video/webm=Vídeo WebM
fmdb_inputFile.accept.video/ogg=Vídeo Ogg
fmdb_inputFile.accept.video/x-matroska=Vídeo MKV
fmdb_inputFile.multiple=Varios archivos
fmdb_inputFile.multiple.ui.tooltip=Permite seleccionar varios archivos a la vez.<br/><b>Uso:</b> <i>Activa la selección múltiple en el selector de archivos</i>.<br/><b>Nota:</b> <i>Cambia la estructura de datos del formulario a un array</i>.
fmdb_inputFile.required=Obligatorio
fmdb_inputFile.required.ui.tooltip=Hace este campo de archivo obligatorio para enviar el formulario.<br/><b>Validación:</b> Debe seleccionarse al menos un archivo para enviar el formulario.
fmdb_inputEmail=Campo Correo electrónico
fmdb_inputEmail.ui.tooltip=Un campo de correo electrónico con validación nativa y teclado optimizado para móviles.
fmdb_inputEmail.helpText=Ayuda de entrada
fmdb_inputEmail.helpText.ui.tooltip=Indicación mostrada bajo la etiqueta del campo para ayudar a rellenarlo.<br/><b>Accesibilidad:</b> <i>Anunciada por los lectores de pantalla mediante aria-describedby</i>.
fmdb_inputEmail.placeholder=Texto de ejemplo
fmdb_inputEmail.placeholder.ui.tooltip=Texto mostrado dentro del campo de correo cuando está vacío.<br/><b>Uso:</b> <i>Ofrece pistas o ejemplos para guiar la entrada</i>.<br/><b>Ejemplo:</b> <i>user@example.com</i>.<br/><b>Modo múltiple:</b> <i>user1@example.com, user2@example.com</i>.
fmdb_inputEmail.defaultValue=Valor por defecto
fmdb_inputEmail.defaultValue.ui.tooltip=Dirección prerrellenada que aparece al mostrar el campo por primera vez.<br/><b>Uso:</b> <i>Definir un contenido inicial o valores sugeridos</i>.
fmdb_inputEmail.minLength=Longitud mínima
fmdb_inputEmail.minLength.ui.tooltip=Número mínimo de caracteres requeridos en este campo de correo.<br/><b>Validación:</b> Impide enviar el formulario con direcciones más cortas.
fmdb_inputEmail.maxLength=Longitud máxima
fmdb_inputEmail.maxLength.ui.tooltip=Número máximo de caracteres permitidos en este campo de correo.<br/><b>Validación:</b> Impide introducir más caracteres de los indicados.<br/><b>Nota:</b> <i>Debe ser mayor que minLength si ambos están definidos</i>.
fmdb_inputEmail.multiple=Varias direcciones
fmdb_inputEmail.multiple.ui.tooltip=Permite introducir varias direcciones de correo separadas por comas.<br/><b>Uso:</b> <i>Recoger varios destinatarios o direcciones de notificación</i>.<br/><b>Ejemplo:</b> <i>user1@example.com, user2@example.com</i>.
fmdb_inputEmail.autocomplete=Autocompletado
fmdb_inputEmail.autocomplete.ui.tooltip=Activa el autocompletado del navegador para este campo de correo.<br/><b>Uso:</b><br/>- <b>on</b>: <i>Activar el autocompletado (por defecto)</i><br/>- <b>off</b>: <i>Desactivar el autocompletado</i><br/>- <b>Valor personalizado</b>: <i>Cualquier token de autocompletado HTML5 (p. ej. 'email', 'customer-email')</i>.
fmdb_inputEmail.list=Lista de direcciones sugeridas
fmdb_inputEmail.list.ui.tooltip=Lista de direcciones predefinidas para las sugerencias de autocompletado.<br/><b>Uso:</b> <i>Ofrece direcciones sugeridas en un menú desplegable</i>.<br/><b>Ejemplo:</b> <i>admin@company.com, support@company.com</i>.
fmdb_inputEmail.pattern=Patrón de correo
fmdb_inputEmail.pattern.ui.tooltip=Patrón regex personalizado para validar el correo más allá del formato estándar.<br/><b>Uso:</b> <i>Restringir el correo a dominios o formatos concretos</i>.<br/><b>Ejemplo:</b> <i>.*@company\.com solo para correos de la empresa</i>.<br/><b>Nota:</b> <i>Actúa además de la validación nativa del correo</i>.
fmdb_inputEmail.required=Obligatorio
fmdb_inputEmail.required.ui.tooltip=Hace este campo de correo obligatorio para enviar el formulario.<br/><b>Validación:</b> Impide el envío cuando el campo está vacío y valida el formato del correo.
fmdb_inputColor=Campo Color
fmdb_inputColor.ui.tooltip=Un campo selector de color que abre la interfaz de selección de color nativa.
fmdb_inputColor.helpText=Ayuda de entrada
fmdb_inputColor.helpText.ui.tooltip=Indicación mostrada bajo la etiqueta del campo para ayudar a rellenarlo.<br/><b>Accesibilidad:</b> <i>Anunciada por los lectores de pantalla mediante aria-describedby</i>.
fmdb_inputColor.defaultValue=Color por defecto
fmdb_inputColor.defaultValue.ui.tooltip=El formato del color por defecto depende del espacio de color.<br/><b>Limited-sRGB:</b> <i>Formato hexadecimal (#RRGGBB o #RRGGBBAA)</i>.<br/><b>Display-P3:</b> <i>Formato hexadecimal o CSS color(display-p3 r g b)</i>.<br/><b>Ejemplo:</b> <i>#FF0000, color(display-p3 1 0 0)</i>.
fmdb_inputColor.required=Obligatorio
fmdb_inputColor.required.ui.tooltip=Hace este campo de color obligatorio para enviar el formulario.<br/><b>Validación:</b> Impide el envío cuando el campo está vacío.<br/><b>Nota:</b> <i>Un campo de color siempre tiene un valor, así que esto afecta sobre todo a la semántica del formulario</i>.
