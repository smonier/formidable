fmdbmix_requireAuthentication.ui.tooltip=Beschränkt das Absenden des Formulars auf angemeldete Benutzer.<br/><b>Wenn aktiviert:</b> <i>Anonyme Übermittlungen werden serverseitig mit dem Fehler FMDB-009 abgelehnt</i>.<br/><b>Hinweis:</b> <i>Das Formular wird anonymen Benutzern weiterhin angezeigt, das Absenden schlägt jedoch fehl</i>.
fmdbmix_captcha=CAPTCHA
fmdbmix_captcha.ui.tooltip=Aktiviert den CAPTCHA-Schutz für dieses Formular. Die Widget-Konfiguration wird aus der globalen Datei org.jahia.modules.formidable.captcha.cfg gelesen. Das Token wird immer serverseitig geprüft.
fmdb_formReference=Formularreferenz
fmdb_formReference.ui.tooltip=Eine Referenz auf ein bestehendes Formular. Rendert das referenzierte Formular an dieser Stelle.<br/><b>Verwendung:</b> <i>Dasselbe Formular auf mehreren Seiten wiederverwenden, ohne Inhalte zu duplizieren</i>.
fmdb_formReference.j_node=Formular
fmdb_formReference.j_node.ui.tooltip=Wählen Sie das anzuzeigende Formular.<br/><b>Hinweis:</b> <i>Wird das referenzierte Formular gelöscht, wird in der Live-Ansicht nichts gerendert</i>.
fmdb.section.validationMessages=Validierungsmeldungen
fmdb.fieldset.textConstraints=Texteinschränkungen
fmdb.fieldset.rangeConstraints=Bereichseinschränkungen
fmdbmix_validationMessages=Validierungsmeldungen
fmdbmix_validationMessages.ui.tooltip=Ersetzen Sie die Standard-Validierungsmeldungen des Browsers durch eigene Texte für dieses Feld.
fmdbmix_validationMessages.msgValueMissing=Meldung für Pflichtfeld
fmdbmix_validationMessages.msgValueMissing.ui.tooltip=Meldung, wenn ein Pflichtfeld leer gelassen wird.<br/><b>Wenn leer:</b> <i>wird die Standardmeldung des Browsers verwendet</i>.
fmdbmix_textValidationMessages=Text-Validierungsmeldungen
fmdbmix_textValidationMessages.ui.tooltip=Ersetzen Sie die Standardmeldungen des Browsers für Texteinschränkungsfehler.
fmdbmix_textValidationMessages.msgTypeMismatch=Meldung bei Typabweichung
fmdbmix_textValidationMessages.msgTypeMismatch.ui.tooltip=Meldung, wenn der Wert nicht dem erwarteten Typ entspricht (z. B. ungültiges E-Mail-Format).<br/><b>Wenn leer:</b> <i>wird die Standardmeldung des Browsers verwendet</i>.
fmdbmix_textValidationMessages.msgPatternMismatch=Meldung bei Musterabweichung
fmdbmix_textValidationMessages.msgPatternMismatch.ui.tooltip=Meldung, wenn der Wert nicht dem geforderten Muster entspricht.<br/><b>Wenn leer:</b> <i>wird die Standardmeldung des Browsers verwendet</i>.
fmdbmix_textValidationMessages.msgTooShort=Meldung bei zu kurzem Wert
fmdbmix_textValidationMessages.msgTooShort.ui.tooltip=Meldung, wenn der Wert kürzer als die Mindestlänge ist.<br/><b>Wenn leer:</b> <i>wird die Standardmeldung des Browsers verwendet</i>.
fmdbmix_textValidationMessages.msgTooLong=Meldung bei zu langem Wert
fmdbmix_textValidationMessages.msgTooLong.ui.tooltip=Meldung, wenn der Wert die Maximallänge überschreitet.<br/><b>Wenn leer:</b> <i>wird die Standardmeldung des Browsers verwendet</i>.
fmdbmix_rangeValidationMessages=Bereichs-Validierungsmeldungen
fmdbmix_rangeValidationMessages.ui.tooltip=Ersetzen Sie die Standardmeldungen des Browsers für Bereichseinschränkungsfehler.
fmdbmix_rangeValidationMessages.msgRangeUnderflow=Meldung bei Unterschreiten des Minimums
fmdbmix_rangeValidationMessages.msgRangeUnderflow.ui.tooltip=Meldung, wenn der Wert unter dem zulässigen Minimum liegt.<br/><b>Wenn leer:</b> <i>wird die Standardmeldung des Browsers verwendet</i>.
fmdbmix_rangeValidationMessages.msgRangeOverflow=Meldung bei Überschreiten des Maximums
fmdbmix_rangeValidationMessages.msgRangeOverflow.ui.tooltip=Meldung, wenn der Wert das zulässige Maximum überschreitet.<br/><b>Wenn leer:</b> <i>wird die Standardmeldung des Browsers verwendet</i>.
fmdbmix_rangeValidationMessages.msgStepMismatch=Meldung bei Schrittweitenabweichung
fmdbmix_rangeValidationMessages.msgStepMismatch.ui.tooltip=Meldung, wenn der Wert nicht zum Schrittintervall passt.<br/><b>Wenn leer:</b> <i>wird die Standardmeldung des Browsers verwendet</i>.
fmdbmix_rangeValidationMessages.msgBadInput=Meldung bei ungültiger Eingabe
fmdbmix_rangeValidationMessages.msgBadInput.ui.tooltip=Meldung, wenn der Browser den Eingabewert nicht auswerten kann.<br/><b>Wenn leer:</b> <i>wird die Standardmeldung des Browsers verwendet</i>.

# Type label of the "any content" mixin: shown by the Page Builder create buttons
# ("New <type> in fields") and the content type selector.
fmdbmix_formContent=Formularinhalt
# Type label of the concrete-field mixin (fmdbmix:element, what a fieldset accepts): the Page
# Builder names its create button after it, like the step's "Form field" (fmdbmix:formElement).
fmdbmix_element=Formularfeld
