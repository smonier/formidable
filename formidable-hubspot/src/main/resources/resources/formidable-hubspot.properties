fmdbhs_createContactAction=Create HubSpot Contact
fmdbhs_createContactAction.ui.tooltip=Creates a Contact in HubSpot from the submitted values. Map each HubSpot contact property to a form field or to a constant value.
fmdbhs_createContactAction.connectionId=HubSpot connection
fmdbhs_createContactAction.connectionId.ui.tooltip=HubSpot portal to send the contact to. The list of connections is managed by an administrator in the module configuration.
fmdbhs_createContactAction.fieldMapping=Contact property mapping
fmdbhs_createContactAction.fieldMapping.ui.tooltip=For each HubSpot contact property, choose the form field whose value is sent, or type a constant value. Map the email so HubSpot can deduplicate the contact.
fmdbhs_createContactAction.duplicateStrategy=Duplicate handling
fmdbhs_createContactAction.duplicateStrategy.ui.tooltip=What to do when a contact with the same email already exists in HubSpot.
fmdbhs_createContactAction.duplicateStrategy.create=Always create a new contact
fmdbhs_createContactAction.duplicateStrategy.upsertByEmail=Update the existing contact with the same email
fmdbhs_createContactAction.failSubmissionOnError=Fail the submission when HubSpot rejects the contact
fmdbhs_createContactAction.failSubmissionOnError.ui.tooltip=When enabled, a HubSpot error makes the form submission fail and the visitor sees an error. When disabled, the error is only logged and the submission succeeds.
fmdbhs.section.hubspot=HubSpot
