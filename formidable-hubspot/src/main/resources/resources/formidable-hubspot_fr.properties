fmdbhs_createContactAction=Cr\u00e9er un contact HubSpot
fmdbhs_createContactAction.ui.tooltip=Cr\u00e9e un contact dans HubSpot \u00e0 partir des valeurs soumises. Associez chaque propri\u00e9t\u00e9 du contact HubSpot \u00e0 un champ du formulaire ou \u00e0 une valeur constante.
fmdbhs_createContactAction.connectionId=Connexion HubSpot
fmdbhs_createContactAction.connectionId.ui.tooltip=Portail HubSpot vers lequel le contact est envoy\u00e9. La liste des connexions est g\u00e9r\u00e9e par un administrateur dans la configuration du module.
fmdbhs_createContactAction.fieldMapping=Correspondance des propri\u00e9t\u00e9s du contact
fmdbhs_createContactAction.fieldMapping.ui.tooltip=Pour chaque propri\u00e9t\u00e9 du contact HubSpot, choisissez le champ du formulaire dont la valeur est envoy\u00e9e, ou saisissez une valeur constante. Associez l'e-mail pour que HubSpot puisse d\u00e9doublonner le contact.
fmdbhs_createContactAction.duplicateStrategy=Gestion des doublons
fmdbhs_createContactAction.duplicateStrategy.ui.tooltip=Comportement lorsqu'un contact avec la m\u00eame adresse e-mail existe d\u00e9j\u00e0 dans HubSpot.
fmdbhs_createContactAction.duplicateStrategy.create=Toujours cr\u00e9er un nouveau contact
fmdbhs_createContactAction.duplicateStrategy.upsertByEmail=Mettre \u00e0 jour le contact existant ayant la m\u00eame adresse e-mail
fmdbhs_createContactAction.failSubmissionOnError=Faire \u00e9chouer la soumission si HubSpot rejette le contact
fmdbhs_createContactAction.failSubmissionOnError.ui.tooltip=Si activ\u00e9, une erreur HubSpot fait \u00e9chouer la soumission du formulaire et le visiteur voit un message d'erreur. Si d\u00e9sactiv\u00e9, l'erreur est seulement journalis\u00e9e et la soumission r\u00e9ussit.
