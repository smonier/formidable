# Labels of the jExperience integration (Java module: ISO-8859-1, non-ASCII escaped as \uXXXX).
# Author-facing wording speaks of the visitor profile, never of jCustomer.
# formidableJExperienceProfileProperties.kept is shown as an entry DESCRIPTION, which jcontent hands to i18next: no
# ":" and no "." in it (ResourceBundlesTest). The none/unavailable messages are entry labels, rendered verbatim.
fmdb.section.jexperience=jExperience

fmdbmix_jExperienceSensitiveField=Privacy
fmdbmix_jExperienceSensitiveField.jExperienceSensitive=This field is sensitive
fmdbmix_jExperienceSensitiveField.jExperienceSensitive.ui.tooltip=Switch on when this field's value must never leave the site: it is left out of what the submission sends to jExperience, and the field cannot be mapped to a visitor profile property. Submissions stop carrying it as soon as you save, without waiting for a publication.

fmdbmix_jExperienceProfileMapping=Visitor profile mapping
fmdbmix_jExperienceProfileMapping.ui.tooltip=Switch on to write this field's value into the visitor's profile when the form is submitted.
fmdbmix_jExperienceProfileMapping.jExperienceProfileProperty=Visitor profile property
fmdbmix_jExperienceProfileMapping.jExperienceProfileProperty.ui.tooltip=<strong>Note:</strong> a property created in jExperience a moment ago can take up to <strong>1 min</strong> to appear here \u2014 close and reopen the field.<br/>The visitor profile property this field maps to. Only the properties matching the field's type and cardinality are listed.
fmdbmix_jExperienceProfileMapping.jExperienceSetStrategy=When the visitor profile already has a value
fmdbmix_jExperienceProfileMapping.jExperienceSetStrategy.ui.tooltip=Whether a submitted value replaces a value already present in the visitor's profile, or is written only when the profile has none.
fmdbmix_jExperienceProfileMapping.jExperienceSetStrategy.alwaysSet=Replace it with the submitted value
fmdbmix_jExperienceProfileMapping.jExperienceSetStrategy.setIfMissing=Keep it, write only when missing

fmdbmix_jExperienceProfileMapping.jExperiencePrefill=Prefill this field from the visitor profile
fmdbmix_jExperienceProfileMapping.jExperiencePrefill.ui.tooltip=Fills this field, when the page opens, with the value the visitor's profile holds for the property above.<br/>The profile's value replaces a default value; without one, the default stays, and what the visitor typed is never replaced.<br/><strong>Note:</strong> a profile with no value for that property leaves the field as it is.
fmdbmix_jExperienceProfileMapping.jExperiencePrefillThen=Once the profile's value is in the field
fmdbmix_jExperienceProfileMapping.jExperiencePrefillThen.ui.tooltip=What the page does with the field once the profile's value is in it.<br/>Nothing changes when the profile has no value or when the visitor already typed, and a hidden field still sends its value.<br/><strong>Note:</strong> a value the field would reject stays visible, so that the visitor can correct it.
fmdbmix_jExperienceProfileMapping.jExperiencePrefillThen.editable=Leave it editable
fmdbmix_jExperienceProfileMapping.jExperiencePrefillThen.readOnly=Make it read-only
fmdbmix_jExperienceProfileMapping.jExperiencePrefillThen.hidden=Hide it

formidableJExperienceProfileProperties.kept=Current mapping, left unchanged because the visitor profile properties cannot be listed right now (jExperience is not connected)
formidableJExperienceProfileProperties.sensitive=This field is marked as sensitive, so it cannot be mapped to a visitor profile property
formidableJExperienceProfileProperties.none=No visitor profile property matches this field's type yet
formidableJExperienceProfileProperties.unavailable=The visitor profile properties cannot be listed right now: jExperience is not connected
formidableJExperiencePrefillThen.off=Switch the prefill on above to choose what follows
