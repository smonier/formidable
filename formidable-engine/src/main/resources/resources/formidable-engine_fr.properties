fmdb_save2jcrAction=Sauvegarde JCR
fmdb_save2jcrAction.ui.tooltip=Enregistre chaque soumission dans Jahia, pour la consulter ensuite dans l'\u00e9cran R\u00e9sultats de formulaires.

fmdb_forwardAction=Transfert de donn\u00e9es
fmdb_forwardAction.ui.tooltip=Transf\u00e8re les donn\u00e9es compl\u00e8tes du formulaire (y compris les fichiers) vers un endpoint tiers (multipart/form-data). Les tokens CAPTCHA sont retir\u00e9s avant le transfert.
fmdb_forwardAction.targetId=Cible de transfert
fmdb_forwardAction.targetId.ui.tooltip=La liste des cibles disponibles est g\u00e9r\u00e9e par un administrateur.

fmdb_emailNotificationAction=Notification email
fmdb_emailNotificationAction.ui.tooltip=Envoie une notification par email apr\u00e8s une soumission r\u00e9ussie. L'objet et le corps supportent l'interpolation ${nomDuChamp}.
fmdb_emailNotificationAction.to=Destinataire (\u00c0)
fmdb_emailNotificationAction.to.ui.tooltip=Adresse email du destinataire.<br/><b>Exemple :</b> <i>contact@example.com</i>.
fmdb_emailNotificationAction.from=Exp\u00e9diteur (De)
fmdb_emailNotificationAction.from.ui.tooltip=Adresse email affich\u00e9e comme exp\u00e9diteur.<br/><b>Exemple :</b> <i>no-reply@example.com</i>.
fmdb_emailNotificationAction.subject=Objet
fmdb_emailNotificationAction.subject.ui.tooltip=Objet de l'email. Supporte l'interpolation ${nomDuChamp}.<br/><b>Exemple :</b> <i>Nouveau message de ${prenom}</i>.
fmdb_emailNotificationAction.templateMessage=Corps du message
fmdb_emailNotificationAction.templateMessage.ui.tooltip=Corps de l'email. Supporte l'interpolation ${nomDuChamp}.<br/><b>Exemple :</b> <i>Nom : ${prenom} ${nom}\nMessage : ${message}</i>.

fmdb_emailContentAction=Contenu du formulaire par email
fmdb_emailContentAction.ui.tooltip=Envoie par email le contenu soumis du formulaire. L'objet de l'email utilise le titre du formulaire soumis et peut inclure les fichiers upload\u00e9s en pi\u00e8ces jointes.
fmdb_emailContentAction.to=Destinataire (\u00c0)
fmdb_emailContentAction.to.ui.tooltip=Adresse email du destinataire.<br/><b>Exemple :</b> <i>contact@example.com</i>.
fmdb_emailContentAction.from=Exp\u00e9diteur (De)
fmdb_emailContentAction.from.ui.tooltip=Adresse email affich\u00e9e comme exp\u00e9diteur.<br/><b>Exemple :</b> <i>no-reply@example.com</i>.
fmdb_emailContentAction.attachFiles=Joindre les fichiers upload\u00e9s
fmdb_emailContentAction.attachFiles.ui.tooltip=Joindre les fichiers upload\u00e9s valid\u00e9s \u00e0 l'email lorsque le formulaire contient des champs fichier.
fmdb_emailContentAction.maxAttachmentSizeMb=Taille max des pi\u00e8ces jointes (Mo)
fmdb_emailContentAction.maxAttachmentSizeMb.ui.tooltip=Taille maximale autoris\u00e9e par fichier joint pour cette action email.<br/><b>Note :</b> <i>La limite effective ne peut jamais d\u00e9passer la limite globale d'upload configur\u00e9e sur le module.</i><br/><b>Exemple :</b> <i>5</i>.
fmdb.section.configuration=Configuration
fmdb.section.logic=Logique
fmdbmix_formLogicElement=Logique conditionnelle
fmdbmix_formLogicElement.ui.tooltip=D\u00e9finit des r\u00e8gles qui contr\u00f4lent la visibilit\u00e9 de ce champ selon la valeur d'autres champs. Le champ est visible lorsque toutes les r\u00e8gles sont satisfaites, et masqu\u00e9 sinon. Si aucune r\u00e8gle n'est d\u00e9finie, le champ est toujours visible.
fmdbmix_formLogicElement.logics=R\u00e8gles
fmdbmix_formLogicElement.logics.ui.tooltip=D\u00e9finit des r\u00e8gles qui contr\u00f4lent la visibilit\u00e9 de ce champ selon la valeur d'autres champs. Seuls les champs liste, radio, case \u00e0 cocher et date plac\u00e9s avant celui-ci sont \u00e9ligibles comme source. Le champ est visible lorsque toutes les r\u00e8gles configur\u00e9es sont satisfaites, et masqu\u00e9 sinon. Si aucune r\u00e8gle n'est d\u00e9finie, le champ est toujours visible.

fmdbmix_captcha=CAPTCHA
fmdbmix_captcha.ui.tooltip=Active la protection CAPTCHA sur ce formulaire. Le widget est inject\u00e9 automatiquement via la configuration globale (org.jahia.modules.formidable.captcha.cfg). Le jeton est toujours v\u00e9rifi\u00e9 c\u00f4t\u00e9 serveur.

fmdbmix_optionsSource=Options
fmdbmix_optionsSource.optionsMode=Origine des options
fmdbmix_optionsSource.optionsMode.ui.tooltip=Choisissez comment la liste d'options de ce champ est remplie : saisie manuellement, ou fournie par une source d'options.
fmdbmix_manualOptions=Options manuelles
fmdbmix_manualOptions.options=Options
fmdbmix_manualOptions.options.ui.tooltip=Liste des options s\u00e9lectionnables.<br/><br/><b>Chaque ligne contient :</b><br/>- <b>Interrupteur</b> : si activ\u00e9, l'option est s\u00e9lectionn\u00e9e par d\u00e9faut<br/>- <b>Premier champ</b> : valeur envoy\u00e9e au serveur<br/>- <b>Second champ</b> : libell\u00e9 affich\u00e9 \u00e0 l'utilisateur.<br/><br/><b>Langues</b> : les options se cr\u00e9ent dans la langue par d\u00e9faut du site ; dans les autres langues, seuls les libell\u00e9s se traduisent (valeurs, ordre et s\u00e9lections par d\u00e9faut sont partag\u00e9s et r\u00e9align\u00e9s sur la langue par d\u00e9faut \u00e0 l'enregistrement).
fmdbmix_sourcedOptions=Options depuis une source tierce
fmdbmix_sourcedOptions.optionsSourceKey=Source
fmdbmix_sourcedOptions.optionsSourceKey.ui.tooltip=La source d'options qui fournit la liste au moment de l'affichage. Les sources sont d\u00e9clar\u00e9es par votre administrateur.
fmdbmix_categoryOptions=Options depuis des cat\u00e9gories
fmdbmix_categoryOptions.optionsRootCategory=Cat\u00e9gorie racine
fmdbmix_categoryOptions.optionsRootCategory.ui.tooltip=Les options de ce champ sont les cat\u00e9gories directement sous la cat\u00e9gorie s\u00e9lectionn\u00e9e, dans la langue du formulaire affich\u00e9. En live, seules les cat\u00e9gories publi\u00e9es apparaissent.
fmdbmix_contentOptions=Options depuis des contenus du site
fmdbmix_contentOptions.optionsRootNode=Contenu racine
fmdbmix_contentOptions.optionsRootNode.ui.tooltip=Les options de ce champ sont les contenus du type configur\u00e9 trouv\u00e9s sous ce n\u0153ud. En live, seuls les contenus publi\u00e9s lisibles par le visiteur apparaissent.
fmdbmix_contentOptions.optionsNodeType=Type de contenu
fmdbmix_contentOptions.optionsNodeType.ui.tooltip=Nom technique du type de contenu \u00e0 lister (par exemple monmodule:agence). Seuls les contenus de ce type sous le contenu racine deviennent des options.
fmdbmix_contentOptions.optionsNodeType.capExceeded=plus de {0} options r\u00e9solues : restreignez le contenu racine, ou demandez \u00e0 un administrateur d'augmenter la limite
fmdbmix_dateBounds=Bornes de date
fmdbmix_dateBounds.minBoundMode=Origine de la date minimale
fmdbmix_dateBounds.minBoundMode.ui.tooltip=D'o\u00f9 vient la date s\u00e9lectionnable la plus ancienne : aucune, une date fixe choisie dans un calendrier, ou la date courante \u2014 le jour o\u00f9 le visiteur soumet le formulaire.<br/><b>Usage de la date courante :</b> <i>Dates de rendez-vous ou de r\u00e9servation qui ne doivent pas \u00eatre pass\u00e9es</i>.
fmdbmix_dateBounds.maxBoundMode=Origine de la date maximale
fmdbmix_dateBounds.maxBoundMode.ui.tooltip=D'o\u00f9 vient la date s\u00e9lectionnable la plus tardive : aucune, une date fixe choisie dans un calendrier, ou la date courante \u2014 le jour o\u00f9 le visiteur soumet le formulaire.<br/><b>Usage de la date courante :</b> <i>Dates de naissance ou d'\u00e9v\u00e9nements pass\u00e9s qui ne doivent pas \u00eatre futures</i>.
fmdbmix_fixedMinDate=Date minimale fixe
fmdbmix_fixedMinDate.min=Date minimale
fmdbmix_fixedMinDate.min.ui.tooltip=La date la plus ancienne s\u00e9lectionnable.<br/><b>Validation :</b> Emp\u00eache la s\u00e9lection de dates ant\u00e9rieures \u00e0 cette valeur.<br/><b>Doit rester avant (ou \u00e9gale \u00e0) la borne maximale</b> \u2014 des bornes invers\u00e9es ne laissent aucune date s\u00e9lectionnable.
fmdbmix_fixedMaxDate=Date maximale fixe
fmdbmix_fixedMaxDate.max=Date maximale
fmdbmix_fixedMaxDate.max.ui.tooltip=La date la plus tardive s\u00e9lectionnable.<br/><b>Validation :</b> Emp\u00eache la s\u00e9lection de dates post\u00e9rieures \u00e0 cette valeur.<br/><b>Doit rester apr\u00e8s (ou \u00e9gale \u00e0) la borne minimale</b> \u2014 des bornes invers\u00e9es ne laissent aucune date s\u00e9lectionnable.
fmdbmix_relativeMinDate=Date minimale relative
fmdbmix_relativeMinDate.minRelativeAmount=D\u00e9calage par rapport \u00e0 la date courante
fmdbmix_relativeMinDate.minRelativeAmount.ui.tooltip=Nombre sign\u00e9 d'unit\u00e9s ajout\u00e9 \u00e0 la date courante pour obtenir la date minimale s\u00e9lectionnable. <b>Exemples :</b> <i>-18 ann\u00e9es impose des dates d'au moins 18 ans dans le pass\u00e9 (limite d'\u00e2ge) ; +30 jours autorise au plus 30 jours dans le futur (fen\u00eatre de r\u00e9servation)</i>.<br/><b>Doit rester avant (ou \u00e9gale \u00e0) la borne maximale</b> \u2014 des bornes invers\u00e9es ne laissent aucune date s\u00e9lectionnable.
fmdbmix_relativeMinDate.minRelativeUnit=Unit\u00e9 du d\u00e9calage
fmdbmix_relativeMinDate.minRelativeUnit.ui.tooltip=Jours, mois ou ann\u00e9es. L'arithm\u00e9tique des mois et des ann\u00e9es se cale sur la fin des mois plus courts (31 janvier + 1 mois = 28 ou 29 f\u00e9vrier).
fmdbmix_relativeMaxDate=Date maximale relative
fmdbmix_relativeMaxDate.maxRelativeAmount=D\u00e9calage par rapport \u00e0 la date courante
fmdbmix_relativeMaxDate.maxRelativeAmount.ui.tooltip=Nombre sign\u00e9 d'unit\u00e9s ajout\u00e9 \u00e0 la date courante pour obtenir la date maximale s\u00e9lectionnable. <b>Exemples :</b> <i>-18 ann\u00e9es impose des dates d'au moins 18 ans dans le pass\u00e9 (limite d'\u00e2ge) ; +30 jours autorise au plus 30 jours dans le futur (fen\u00eatre de r\u00e9servation)</i>.<br/><b>Doit rester apr\u00e8s (ou \u00e9gale \u00e0) la borne minimale</b> \u2014 des bornes invers\u00e9es ne laissent aucune date s\u00e9lectionnable.
fmdbmix_relativeMaxDate.maxRelativeUnit=Unit\u00e9 du d\u00e9calage
fmdbmix_relativeMaxDate.maxRelativeUnit.ui.tooltip=Jours, mois ou ann\u00e9es. L'arithm\u00e9tique des mois et des ann\u00e9es se cale sur la fin des mois plus courts (31 janvier + 1 mois = 28 ou 29 f\u00e9vrier).
fmdbmix_datetimeBounds=Bornes de date et heure
fmdbmix_datetimeBounds.minBoundMode=Origine de la date et heure minimales
fmdbmix_datetimeBounds.minBoundMode.ui.tooltip=D'o\u00f9 viennent la date et l'heure s\u00e9lectionnables les plus anciennes : aucune, une valeur fixe, ou la date courante \u2014 d\u00e8s le d\u00e9but du jour o\u00f9 le visiteur soumet le formulaire.<br/><b>Usage de la date courante :</b> <i>Cr\u00e9neaux de rendez-vous ou de r\u00e9servation qui ne doivent pas \u00eatre pass\u00e9s</i>.
fmdbmix_datetimeBounds.maxBoundMode=Origine de la date et heure maximales
fmdbmix_datetimeBounds.maxBoundMode.ui.tooltip=D'o\u00f9 viennent la date et l'heure s\u00e9lectionnables les plus tardives : aucune, une valeur fixe, ou la date courante \u2014 jusqu'\u00e0 la fin du jour o\u00f9 le visiteur soumet le formulaire.<br/><b>Usage de la date courante :</b> <i>Dates d'\u00e9v\u00e9nements qui ne doivent pas \u00eatre futures</i>.
fmdbmix_fixedMinDatetime=Date et heure minimales fixes
fmdbmix_fixedMinDatetime.min=Date et heure minimales
fmdbmix_fixedMinDatetime.min.ui.tooltip=La date et l'heure les plus anciennes s\u00e9lectionnables.<br/><b>Validation :</b> Emp\u00eache la s\u00e9lection de valeurs ant\u00e9rieures.<br/><b>Doit rester avant (ou \u00e9gale \u00e0) la borne maximale</b> \u2014 des bornes invers\u00e9es ne laissent aucune date s\u00e9lectionnable.
