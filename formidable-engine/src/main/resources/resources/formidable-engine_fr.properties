# --- Field actions (docs/architecture/field-actions.md) ---
fmdbmix_fieldActions=Activer les actions du champ
fmdbmix_fieldActions.ui.tooltip=Activez-le pour ajouter des actions sous le champ. Le d\u00e9sactiver supprime les actions du champ.<br/>Une action v\u00e9rifie que la valeur saisie par le visiteur est acceptable : une adresse e-mail v\u00e9rifi\u00e9e aupr\u00e8s d'un fournisseur, ou une r\u00e8gle m\u00e9tier \u00e0 vous.
fmdb_fieldActionList=Actions du champ
fmdbmix_fieldActionFeedback=Comportement et message
fmdbmix_fieldActionFeedback.rejectionMessage=Message quand la valeur est refus\u00e9e
fmdbmix_fieldActionFeedback.rejectionMessage.ui.tooltip=Affich\u00e9 sous le champ quand cette action refuse la valeur. <b>${value}</b> ins\u00e8re la valeur saisie par le visiteur.
fmdbmix_fieldActionFeedback.rejectionMessage.default=Cette valeur n'a pas pu \u00eatre v\u00e9rifi\u00e9e.
fmdb_fieldActions.tooManyValues=Trop de r\u00e9ponses ont \u00e9t\u00e9 envoy\u00e9es pour que ce champ soit v\u00e9rifi\u00e9. Veuillez en s\u00e9lectionner moins.
fmdbmix_fieldActionFeedback.trigger=Quand v\u00e9rifier
fmdbmix_fieldActionFeedback.trigger.ui.tooltip=Quand le visiteur quitte le champ, pour une v\u00e9rification rapide, ou seulement \u00e0 la soumission, pour une v\u00e9rification qui co\u00fbte un appel \u00e0 un service payant. La v\u00e9rification est toujours rejou\u00e9e \u00e0 la soumission.
fmdbmix_fieldActionFeedback.trigger.blur=Quand le visiteur quitte le champ
fmdbmix_fieldActionFeedback.trigger.submit=\u00c0 la soumission
fmdbmix_fieldActionFeedback.severity=Si la valeur est refus\u00e9e
fmdbmix_fieldActionFeedback.severity.ui.tooltip=Bloquer la soumission jusqu'\u00e0 correction de la valeur, ou afficher un avertissement et laisser passer la soumission.
fmdbmix_fieldActionFeedback.severity.block=Bloquer la soumission
fmdbmix_fieldActionFeedback.severity.warn=Avertir seulement
fmdbmix_fieldActionFeedback.whenUnavailable=Si la v\u00e9rification ne peut pas s'ex\u00e9cuter
fmdbmix_fieldActionFeedback.whenUnavailable.ui.tooltip=Quand le service derri\u00e8re la v\u00e9rification ne r\u00e9pond pas : accepter la valeur, pour qu'une panne ne bloque jamais les visiteurs, ou la refuser, pour un formulaire qui ne doit pas passer sans v\u00e9rification.
fmdbmix_fieldActionFeedback.whenUnavailable.accept=Accepter la valeur
fmdbmix_fieldActionFeedback.whenUnavailable.reject=Refuser la valeur
