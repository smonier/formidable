fmdbmix_relativeMinDatetime.minRelativeUnit.ui.tooltip=D\u00edas, meses o a\u00f1os. La aritm\u00e9tica de meses y a\u00f1os se ajusta al final de los meses m\u00e1s cortos (31 de enero + 1 mes = 28 o 29 de febrero).
fmdbmix_relativeMaxDatetime=Fecha y hora m\u00e1ximas relativas
fmdbmix_relativeMaxDatetime.maxRelativeAmount=Desplazamiento desde la fecha actual
fmdbmix_relativeMaxDatetime.maxRelativeAmount.ui.tooltip=N\u00famero con signo de unidades a\u00f1adidas a la fecha actual para obtener la fecha y hora m\u00e1ximas seleccionables. <b>Ejemplos:</b> <i>-18 a\u00f1os mantiene las fechas al menos 18 a\u00f1os en el pasado (l\u00edmite de edad); +30 d\u00edas permite como m\u00e1ximo 30 d\u00edas por delante (ventana de reserva)</i>.<br/><b>Debe quedar despu\u00e9s (o igual) que el m\u00ednimo</b> \u2014 unos l\u00edmites invertidos no dejan ninguna fecha seleccionable.
