fmdbmix_formStep=Paso de formulario

# --- Field actions (docs/architecture/field-actions.md) ---
fmdbmix_fieldActions=Activar las acciones del campo
fmdbmix_fieldActions.ui.tooltip=Act\u00edvelo para a\u00f1adir acciones bajo el campo. Desactivarlo elimina las acciones del campo.<br/>Una acci\u00f3n comprueba que el valor introducido por el visitante sea aceptable: una direcci\u00f3n de correo verificada con un proveedor o una regla de negocio propia.
fmdb_fieldActionList=Acciones del campo
fmdbmix_fieldActionFeedback=Comportamiento y mensaje
fmdbmix_fieldActionFeedback.rejectionMessage=Mensaje cuando se rechaza el valor
fmdbmix_fieldActionFeedback.rejectionMessage.ui.tooltip=Se muestra bajo el campo cuando esta acci\u00f3n rechaza el valor. <b>${value}</b> inserta el valor escrito por el visitante.
fmdbmix_fieldActionFeedback.rejectionMessage.default=No se ha podido verificar este valor.
fmdb_fieldActions.tooManyValues=Se han enviado demasiadas respuestas para poder comprobar este campo. Seleccione menos.
fmdbmix_fieldActionFeedback.trigger=Cu\u00e1ndo comprobar
fmdbmix_fieldActionFeedback.trigger.ui.tooltip=Al salir del campo, para una comprobaci\u00f3n r\u00e1pida, o solo al enviar, para una comprobaci\u00f3n que cuesta una llamada a un servicio de pago. La comprobaci\u00f3n siempre se repite al enviar.
fmdbmix_fieldActionFeedback.trigger.blur=Cuando el visitante sale del campo
fmdbmix_fieldActionFeedback.trigger.submit=Al enviar
fmdbmix_fieldActionFeedback.severity=Si se rechaza el valor
fmdbmix_fieldActionFeedback.severity.ui.tooltip=Bloquear el env\u00edo hasta corregir el valor, o mostrar una advertencia y dejar pasar el env\u00edo.
fmdbmix_fieldActionFeedback.severity.block=Bloquear el env\u00edo
fmdbmix_fieldActionFeedback.severity.warn=Solo advertir
fmdbmix_fieldActionFeedback.whenUnavailable=Si la comprobaci\u00f3n no puede ejecutarse
fmdbmix_fieldActionFeedback.whenUnavailable.ui.tooltip=Cuando el servicio detr\u00e1s de la comprobaci\u00f3n no responde: aceptar el valor, para que una aver\u00eda nunca bloquee a los visitantes, o rechazarlo, para un formulario que no debe pasar sin comprobar.
fmdbmix_fieldActionFeedback.whenUnavailable.accept=Aceptar el valor
fmdbmix_fieldActionFeedback.whenUnavailable.reject=Rechazar el valor
