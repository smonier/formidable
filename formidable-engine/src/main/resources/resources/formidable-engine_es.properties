fmdbmix_actionConfig=Formidable - Acciones de formulario
fmdbmix_formAction=Acci\u00f3n de formulario

fmdb_save2jcrAction=Guardar en el JCR
fmdb_save2jcrAction.ui.tooltip=Guarda cada env\u00edo en Jahia para consultarlo despu\u00e9s en la pantalla "Form Results".

fmdb_forwardAction=Reenviar datos
fmdb_forwardAction.ui.tooltip=Reenv\u00eda los datos completos del formulario (incluidos los archivos) a un punto de acceso de terceros (multipart/form-data). Los campos de token CAPTCHA se eliminan antes del reenv\u00edo.
fmdb_forwardAction.targetId=Destino del reenv\u00edo
fmdb_forwardAction.targetId.ui.tooltip=La lista de destinos disponibles la gestiona un administrador.

fmdb_emailNotificationAction=Notificaci\u00f3n por correo electr\u00f3nico
fmdb_emailNotificationAction.ui.tooltip=Env\u00eda una notificaci\u00f3n por correo electr\u00f3nico tras un env\u00edo correcto del formulario. El asunto y el cuerpo admiten la interpolaci\u00f3n ${fieldName}.
fmdb_emailNotificationAction.to=Destinatario (To)
fmdb_emailNotificationAction.to.ui.tooltip=Direcci\u00f3n de correo electr\u00f3nico del destinatario.<br/><b>Ejemplo:</b> <i>contact@example.com</i>.
fmdb_emailNotificationAction.from=Remitente (From)
fmdb_emailNotificationAction.from.ui.tooltip=Direcci\u00f3n de correo electr\u00f3nico mostrada como remitente.<br/><b>Ejemplo:</b> <i>no-reply@example.com</i>.
fmdb_emailNotificationAction.subject=Asunto
fmdb_emailNotificationAction.subject.ui.tooltip=Asunto del correo electr\u00f3nico. Admite la interpolaci\u00f3n ${fieldName}.<br/><b>Ejemplo:</b> <i>Nuevo mensaje de ${firstname}</i>.
fmdb_emailNotificationAction.templateMessage=Cuerpo del mensaje
fmdb_emailNotificationAction.templateMessage.ui.tooltip=Cuerpo del correo electr\u00f3nico. Admite la interpolaci\u00f3n ${fieldName}.<br/><b>Ejemplo:</b> <i>Nombre: ${firstname} ${lastname}\nMensaje: ${message}</i>.

fmdb_emailContentAction=Contenido del formulario por correo
fmdb_emailContentAction.ui.tooltip=Env\u00eda por correo electr\u00f3nico el contenido enviado del formulario. El asunto usa el t\u00edtulo del formulario enviado y, opcionalmente, puede incluir los archivos subidos como adjuntos.
fmdb_emailContentAction.to=Destinatario (To)
fmdb_emailContentAction.to.ui.tooltip=Direcci\u00f3n de correo electr\u00f3nico del destinatario.<br/><b>Ejemplo:</b> <i>contact@example.com</i>.
fmdb_emailContentAction.from=Remitente (From)
fmdb_emailContentAction.from.ui.tooltip=Direcci\u00f3n de correo electr\u00f3nico mostrada como remitente.<br/><b>Ejemplo:</b> <i>no-reply@example.com</i>.
fmdb_emailContentAction.attachFiles=Adjuntar los archivos subidos
fmdb_emailContentAction.attachFiles.ui.tooltip=Adjunta al correo los archivos subidos y validados cuando el formulario contiene campos de archivo.
fmdb_emailContentAction.maxAttachmentSizeMb=Tama\u00f1o m\u00e1ximo de adjunto (MB)
fmdb_emailContentAction.maxAttachmentSizeMb.ui.tooltip=Tama\u00f1o m\u00e1ximo permitido por archivo adjunto para esta acci\u00f3n de correo.<br/><b>Nota:</b> <i>El l\u00edmite efectivo nunca puede superar el l\u00edmite global de subida configurado en el m\u00f3dulo.</i><br/><b>Ejemplo:</b> <i>5</i>.
fmdb.section.configuration=Configuraci\u00f3n
fmdb.section.logic=L\u00f3gica
fmdbmix_formLogicElement=L\u00f3gica condicional
fmdbmix_formLogicElement.ui.tooltip=Defina reglas que controlan cu\u00e1ndo este campo es visible seg\u00fan el valor de otros campos. El campo es visible cuando todas las reglas se cumplen y queda oculto en caso contrario. Si no hay ninguna regla, el campo siempre es visible.
fmdbmix_formLogicElement.logics=Reglas
fmdbmix_formLogicElement.logics.ui.tooltip=Defina reglas que controlan cu\u00e1ndo este campo es visible seg\u00fan el valor de otros campos. Solo los campos de selecci\u00f3n, radio, casilla y fecha situados antes de este pueden ser campos de origen. El campo es visible cuando todas las reglas configuradas se cumplen y queda oculto en caso contrario. Si no hay ninguna regla, el campo siempre es visible.

fmdbmix_captcha=CAPTCHA
fmdbmix_captcha.ui.tooltip=Activa la protecci\u00f3n CAPTCHA en este formulario. El widget se inserta autom\u00e1ticamente usando la configuraci\u00f3n global (org.jahia.modules.formidable.captcha.cfg). El token se verifica siempre en el servidor.

fmdbmix_optionsSource=Opciones
fmdbmix_optionsSource.optionsMode=Origen de las opciones
fmdbmix_optionsSource.optionsMode.ui.tooltip=Elija c\u00f3mo se rellena la lista de opciones de este campo: escrita manualmente o proporcionada por una fuente de opciones.
fmdbmix_manualOptions=Opciones manuales
fmdbmix_manualOptions.options=Opciones
fmdbmix_manualOptions.options.ui.tooltip=Lista de opciones seleccionables.<br/><br/><b>Cada fila contiene:</b><br/>- <b>Interruptor</b>: si est\u00e1 activado, la opci\u00f3n est\u00e1 seleccionada por defecto<br/>- <b>Primer campo</b>: valor enviado al servidor<br/>- <b>Segundo campo</b>: etiqueta mostrada al usuario.<br/><br/><b>Idiomas</b>: las opciones se crean en el idioma por defecto del sitio; en los dem\u00e1s idiomas solo se traducen las etiquetas (los valores, el orden y las selecciones por defecto son compartidos y se realinean con el idioma por defecto al guardar).
fmdbmix_sourcedOptions=Opciones de una fuente de terceros
fmdbmix_sourcedOptions.optionsSourceKey=Fuente
fmdbmix_sourcedOptions.optionsSourceKey.ui.tooltip=La fuente de opciones que proporciona la lista en el momento de la visualizaci\u00f3n. Las fuentes las declara su administrador.
fmdbmix_categoryOptions=Opciones de categor\u00edas
fmdbmix_categoryOptions.optionsRootCategory=Categor\u00eda ra\u00edz
fmdbmix_categoryOptions.optionsRootCategory.ui.tooltip=Las opciones de este campo son las categor\u00edas directamente bajo la categor\u00eda seleccionada, en el idioma del formulario mostrado. En el sitio publicado solo aparecen las categor\u00edas publicadas.
fmdbmix_contentOptions=Opciones de contenidos del sitio
fmdbmix_contentOptions.optionsRootNode=Contenido ra\u00edz
fmdbmix_contentOptions.optionsRootNode.ui.tooltip=Las opciones de este campo son los contenidos del tipo configurado encontrados bajo este nodo. En el sitio publicado solo aparecen los contenidos publicados legibles por el visitante.
fmdbmix_contentOptions.optionsNodeType=Tipo de contenido
fmdbmix_contentOptions.optionsNodeType.ui.tooltip=Nombre t\u00e9cnico del tipo de contenido a listar (por ejemplo mymodule:agency). Solo los contenidos de este tipo encontrados bajo el contenido ra\u00edz se convierten en opciones.
fmdbmix_contentOptions.optionsNodeType.capExceeded=se resuelven m\u00e1s de {0} opciones: acote el contenido ra\u00edz o pida a un administrador que aumente el l\u00edmite
fmdbmix_dateBounds=L\u00edmites de fecha
fmdbmix_dateBounds.minBoundMode=Origen de la fecha m\u00ednima
fmdbmix_dateBounds.minBoundMode.ui.tooltip=De d\u00f3nde procede la fecha m\u00e1s temprana seleccionable: ninguna, una fecha fija elegida en un calendario o la fecha actual \u2014 el d\u00eda en que el visitante env\u00eda el formulario.<br/><b>Uso de la fecha actual:</b> <i>Fechas de cita o de reserva que no deben estar en el pasado</i>.
fmdbmix_dateBounds.maxBoundMode=Origen de la fecha m\u00e1xima
fmdbmix_dateBounds.maxBoundMode.ui.tooltip=De d\u00f3nde procede la fecha m\u00e1s tard\u00eda seleccionable: ninguna, una fecha fija elegida en un calendario o la fecha actual \u2014 el d\u00eda en que el visitante env\u00eda el formulario.<br/><b>Uso de la fecha actual:</b> <i>Fechas de nacimiento o fechas de \u00abocurrido el\u00bb que no deben estar en el futuro</i>.
fmdbmix_fixedMinDate=Fecha m\u00ednima fija
fmdbmix_fixedMinDate.min=Fecha m\u00ednima
fmdbmix_fixedMinDate.min.ui.tooltip=La fecha m\u00e1s temprana que se puede seleccionar.<br/><b>Validaci\u00f3n:</b> Impide seleccionar fechas anteriores a este valor.<br/><b>Debe quedar antes (o igual) que el m\u00e1ximo</b> \u2014 unos l\u00edmites invertidos no dejan ninguna fecha seleccionable.
fmdbmix_fixedMaxDate=Fecha m\u00e1xima fija
fmdbmix_fixedMaxDate.max=Fecha m\u00e1xima
fmdbmix_fixedMaxDate.max.ui.tooltip=La fecha m\u00e1s tard\u00eda que se puede seleccionar.<br/><b>Validaci\u00f3n:</b> Impide seleccionar fechas posteriores a este valor.<br/><b>Debe quedar despu\u00e9s (o igual) que el m\u00ednimo</b> \u2014 unos l\u00edmites invertidos no dejan ninguna fecha seleccionable.
fmdbmix_relativeMinDate=Fecha m\u00ednima relativa
fmdbmix_relativeMinDate.minRelativeAmount=Desplazamiento desde la fecha actual
fmdbmix_relativeMinDate.minRelativeAmount.ui.tooltip=N\u00famero con signo de unidades a\u00f1adidas a la fecha actual para obtener la fecha m\u00ednima seleccionable. <b>Ejemplos:</b> <i>-18 a\u00f1os mantiene las fechas al menos 18 a\u00f1os en el pasado (l\u00edmite de edad); +30 d\u00edas permite como m\u00e1ximo 30 d\u00edas por delante (ventana de reserva)</i>.<br/><b>Debe quedar antes (o igual) que el m\u00e1ximo</b> \u2014 unos l\u00edmites invertidos no dejan ninguna fecha seleccionable.
fmdbmix_relativeMinDate.minRelativeUnit=Unidad del desplazamiento
fmdbmix_relativeMinDate.minRelativeUnit.ui.tooltip=D\u00edas, meses o a\u00f1os. La aritm\u00e9tica de meses y a\u00f1os se ajusta al final de los meses m\u00e1s cortos (31 de enero + 1 mes = 28 o 29 de febrero).
fmdbmix_relativeMaxDate=Fecha m\u00e1xima relativa
fmdbmix_relativeMaxDate.maxRelativeAmount=Desplazamiento desde la fecha actual
fmdbmix_relativeMaxDate.maxRelativeAmount.ui.tooltip=N\u00famero con signo de unidades a\u00f1adidas a la fecha actual para obtener la fecha m\u00e1xima seleccionable. <b>Ejemplos:</b> <i>-18 a\u00f1os mantiene las fechas al menos 18 a\u00f1os en el pasado (l\u00edmite de edad); +30 d\u00edas permite como m\u00e1ximo 30 d\u00edas por delante (ventana de reserva)</i>.<br/><b>Debe quedar despu\u00e9s (o igual) que el m\u00ednimo</b> \u2014 unos l\u00edmites invertidos no dejan ninguna fecha seleccionable.
fmdbmix_relativeMaxDate.maxRelativeUnit=Unidad del desplazamiento
fmdbmix_relativeMaxDate.maxRelativeUnit.ui.tooltip=D\u00edas, meses o a\u00f1os. La aritm\u00e9tica de meses y a\u00f1os se ajusta al final de los meses m\u00e1s cortos (31 de enero + 1 mes = 28 o 29 de febrero).
fmdbmix_datetimeBounds=L\u00edmites de fecha y hora
fmdbmix_datetimeBounds.minBoundMode=Origen de la fecha y hora m\u00ednimas
fmdbmix_datetimeBounds.minBoundMode.ui.tooltip=De d\u00f3nde procede la fecha y hora m\u00e1s temprana seleccionable: ninguna, una fecha y hora fijas o la fecha actual \u2014 desde el inicio del d\u00eda en que el visitante env\u00eda el formulario.<br/><b>Uso de la fecha actual:</b> <i>Franjas de cita o de reserva que no deben estar en el pasado</i>.
fmdbmix_datetimeBounds.maxBoundMode=Origen de la fecha y hora m\u00e1ximas
fmdbmix_datetimeBounds.maxBoundMode.ui.tooltip=De d\u00f3nde procede la fecha y hora m\u00e1s tard\u00eda seleccionable: ninguna, una fecha y hora fijas o la fecha actual \u2014 hasta el final del d\u00eda en que el visitante env\u00eda el formulario.<br/><b>Uso de la fecha actual:</b> <i>Fechas y horas de eventos que no deben estar en el futuro</i>.
fmdbmix_fixedMinDatetime=Fecha y hora m\u00ednimas fijas
fmdbmix_fixedMinDatetime.min=Fecha y hora m\u00ednimas
fmdbmix_fixedMinDatetime.min.ui.tooltip=La fecha y hora m\u00e1s temprana que se puede seleccionar.<br/><b>Validaci\u00f3n:</b> Impide seleccionar fechas y horas anteriores a este valor.<br/><b>Debe quedar antes (o igual) que el m\u00e1ximo</b> \u2014 unos l\u00edmites invertidos no dejan ninguna fecha seleccionable.
