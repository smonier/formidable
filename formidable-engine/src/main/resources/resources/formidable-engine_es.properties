fmdbmix_fixedMaxDatetime.max=Fecha y hora m\u00e1ximas
fmdbmix_fixedMaxDatetime.max.ui.tooltip=La fecha y hora m\u00e1s tard\u00eda que se puede seleccionar.<br/><b>Validaci\u00f3n:</b> Impide seleccionar fechas y horas posteriores a este valor.<br/><b>Debe quedar despu\u00e9s (o igual) que el m\u00ednimo</b> \u2014 unos l\u00edmites invertidos no dejan ninguna fecha seleccionable.
fmdbmix_relativeMinDatetime=Fecha y hora m\u00ednimas relativas
fmdbmix_relativeMinDatetime.minRelativeAmount=Desplazamiento desde la fecha actual
fmdbmix_relativeMinDatetime.minRelativeAmount.ui.tooltip=N\u00famero con signo de unidades a\u00f1adidas a la fecha actual para obtener la fecha y hora m\u00ednimas seleccionables. <b>Ejemplos:</b> <i>-18 a\u00f1os mantiene las fechas al menos 18 a\u00f1os en el pasado (l\u00edmite de edad); +30 d\u00edas permite como m\u00e1ximo 30 d\u00edas por delante (ventana de reserva)</i>.<br/><b>Debe quedar antes (o igual) que el m\u00e1ximo</b> \u2014 unos l\u00edmites invertidos no dejan ninguna fecha seleccionable.
