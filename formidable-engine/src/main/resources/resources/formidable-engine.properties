fmdbmix_formStep=Form step

# --- Field actions (docs/architecture/field-actions.md) ---
fmdbmix_fieldActions=Enable field actions
fmdbmix_fieldActions.ui.tooltip=Turn it on to add actions under the field. Turning it off deletes the field's actions.<br/>An action checks that the value the visitor entered is one you can accept: an email address verified with a provider, or a business rule of your own.
fmdb_fieldActionList=Field actions
fmdbmix_fieldActionFeedback=Behaviour and message
fmdbmix_fieldActionFeedback.rejectionMessage=Message when the value is refused
fmdbmix_fieldActionFeedback.rejectionMessage.ui.tooltip=Shown under the field when this action refuses the value. <b>${value}</b> inserts the value the visitor typed.
fmdbmix_fieldActionFeedback.rejectionMessage.default=This value could not be verified.
fmdb_fieldActions.tooManyValues=Too many answers were sent for this field to be checked. Please select fewer.
fmdbmix_fieldActionFeedback.trigger=When to check
fmdbmix_fieldActionFeedback.trigger.ui.tooltip=When the visitor leaves the field, for a quick check, or at submission only, for a check that costs a call to a paid service. The check always runs again at submission.
fmdbmix_fieldActionFeedback.trigger.blur=When the visitor leaves the field
fmdbmix_fieldActionFeedback.trigger.submit=At submission
fmdbmix_fieldActionFeedback.severity=If the value is refused
fmdbmix_fieldActionFeedback.severity.ui.tooltip=Block the submission until the value is corrected, or show a warning and let the submission through.
fmdbmix_fieldActionFeedback.severity.block=Block the submission
fmdbmix_fieldActionFeedback.severity.warn=Warn only
fmdbmix_fieldActionFeedback.whenUnavailable=If the check cannot run
fmdbmix_fieldActionFeedback.whenUnavailable.ui.tooltip=When the service behind the check does not answer: accept the value, so that an outage never blocks visitors, or refuse it, for a form that must not pass unchecked.
fmdbmix_fieldActionFeedback.whenUnavailable.accept=Accept the value
fmdbmix_fieldActionFeedback.whenUnavailable.reject=Refuse the value
