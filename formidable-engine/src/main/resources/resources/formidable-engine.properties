fmdbmix_actionConfig=Formidable - Form Actions
fmdbmix_formAction=Form Action

fmdb_save2jcrAction=Save to JCR
fmdb_save2jcrAction.ui.tooltip=Stores each submission in Jahia, to be reviewed later in the Form Results screen.

fmdb_forwardAction=Forward Data
fmdb_forwardAction.ui.tooltip=Forwards the complete form data (including files) to a third-party endpoint (multipart/form-data). CAPTCHA token fields are stripped before forwarding.
fmdb_forwardAction.targetId=Forward Target
fmdb_forwardAction.targetId.ui.tooltip=The list of available targets is managed by an administrator.

fmdb_emailNotificationAction=Email Notification
fmdb_emailNotificationAction.ui.tooltip=Sends an email notification after a successful form submission. Subject and body support ${fieldName} interpolation.
fmdb_emailNotificationAction.to=Recipient (To)
fmdb_emailNotificationAction.to.ui.tooltip=Email address of the recipient.<br/><b>Example:</b> <i>contact@example.com</i>.
fmdb_emailNotificationAction.from=Sender (From)
fmdb_emailNotificationAction.from.ui.tooltip=Email address displayed as the sender.<br/><b>Example:</b> <i>no-reply@example.com</i>.
fmdb_emailNotificationAction.subject=Subject
fmdb_emailNotificationAction.subject.ui.tooltip=Subject line of the email. Supports ${fieldName} interpolation.<br/><b>Example:</b> <i>New message from ${firstname}</i>.
fmdb_emailNotificationAction.templateMessage=Message body
fmdb_emailNotificationAction.templateMessage.ui.tooltip=Body of the email. Supports ${fieldName} interpolation.<br/><b>Example:</b> <i>Name: ${firstname} ${lastname}\nMessage: ${message}</i>.

fmdb_emailContentAction=Email Form Content
fmdb_emailContentAction.ui.tooltip=Sends the submitted form content by email. The email subject uses the submitted form title and can optionally include uploaded files as attachments.
fmdb_emailContentAction.to=Recipient (To)
fmdb_emailContentAction.to.ui.tooltip=Email address of the recipient.<br/><b>Example:</b> <i>contact@example.com</i>.
fmdb_emailContentAction.from=Sender (From)
fmdb_emailContentAction.from.ui.tooltip=Email address displayed as the sender.<br/><b>Example:</b> <i>no-reply@example.com</i>.
fmdb_emailContentAction.attachFiles=Attach uploaded files
fmdb_emailContentAction.attachFiles.ui.tooltip=Attach validated uploaded files to the email when the form contains file inputs.
fmdb_emailContentAction.maxAttachmentSizeMb=Max attachment size (MB)
fmdb_emailContentAction.maxAttachmentSizeMb.ui.tooltip=Maximum size allowed per attached file for this email action.<br/><b>Note:</b> <i>The effective limit can never exceed the global upload limit configured on the module.</i><br/><b>Example:</b> <i>5</i>.
fmdb.section.configuration=Configuration
fmdb.section.logic=Logic
fmdbmix_formLogicElement=Conditional Logic
fmdbmix_formLogicElement.ui.tooltip=Define rules that control when this field is visible based on the value of other fields. The field is visible when all rules match, and hidden otherwise. If no rule is defined, the field is always visible.
fmdbmix_formLogicElement.logics=Rules
fmdbmix_formLogicElement.logics.ui.tooltip=Define rules that control when this field is visible based on the value of other fields. Only select, radio, checkbox, and date fields placed before this one are eligible as source fields. The field is visible when all configured rules match, and hidden otherwise. If no rule is defined, the field is always visible.

fmdbmix_captcha=CAPTCHA
fmdbmix_captcha.ui.tooltip=Enable CAPTCHA protection on this form. The widget is injected automatically using the global configuration (org.jahia.modules.formidable.captcha.cfg). The token is always verified server-side.

fmdbmix_optionsSource=Options
fmdbmix_optionsSource.optionsMode=Options origin
fmdbmix_optionsSource.optionsMode.ui.tooltip=Choose how the option list of this field is filled: typed manually, or provided by an options source.
fmdbmix_manualOptions=Manual options
fmdbmix_manualOptions.options=Options
fmdbmix_manualOptions.options.ui.tooltip=List of selectable options.<br/><br/><b>Each row contains:</b><br/>- <b>Switch</b>: if enabled, the option is selected by default<br/>- <b>First field</b>: value sent to server<br/>- <b>Second field</b>: label displayed to user.<br/><br/><b>Languages</b>: options are created in the site's default language; in the other languages only the labels are translated (values, order and default selections are shared and re-aligned on the default language at save).
fmdbmix_sourcedOptions=Options from a third-party source
fmdbmix_sourcedOptions.optionsSourceKey=Source
fmdbmix_sourcedOptions.optionsSourceKey.ui.tooltip=The options source that provides the list at display time. Sources are declared by your administrator.
fmdbmix_categoryOptions=Options from categories
fmdbmix_categoryOptions.optionsRootCategory=Root category
fmdbmix_categoryOptions.optionsRootCategory.ui.tooltip=The options of this field are the categories directly under the selected category, in the language of the displayed form. In live, only published categories appear.
fmdbmix_contentOptions=Options from site content
fmdbmix_contentOptions.optionsRootNode=Root content
fmdbmix_contentOptions.optionsRootNode.ui.tooltip=The options of this field are the contents of the configured type found under this node. In live, only published contents readable by the visitor appear.
fmdbmix_contentOptions.optionsNodeType=Content type
fmdbmix_contentOptions.optionsNodeType.ui.tooltip=Technical name of the content type to list (for example mymodule:agency). Only contents of this type found under the root content become options.
fmdbmix_contentOptions.optionsNodeType.capExceeded=more than {0} options resolve: narrow the root content, or ask an administrator to raise the limit
fmdbmix_dateBounds=Date bounds
fmdbmix_dateBounds.minBoundMode=Minimum date origin
fmdbmix_dateBounds.minBoundMode.ui.tooltip=Where the earliest selectable date comes from: none, a fixed date picked in a calendar, or the current date \u2014 the day the visitor submits the form.<br/><b>Usage of the current date:</b> <i>Appointment or reservation dates that must not be in the past</i>.
fmdbmix_dateBounds.maxBoundMode=Maximum date origin
fmdbmix_dateBounds.maxBoundMode.ui.tooltip=Where the latest selectable date comes from: none, a fixed date picked in a calendar, or the current date \u2014 the day the visitor submits the form.<br/><b>Usage of the current date:</b> <i>Birth dates or "happened on" dates that must not be in the future</i>.
fmdbmix_fixedMinDate=Fixed minimum date
fmdbmix_fixedMinDate.min=Minimum date
fmdbmix_fixedMinDate.min.ui.tooltip=The earliest date that can be selected.<br/><b>Validation:</b> Prevents selection of dates before this value.<br/><b>Must stay before (or equal to) the maximum</b> \u2014 inverted bounds leave no selectable date.
fmdbmix_fixedMaxDate=Fixed maximum date
fmdbmix_fixedMaxDate.max=Maximum date
fmdbmix_fixedMaxDate.max.ui.tooltip=The latest date that can be selected.<br/><b>Validation:</b> Prevents selection of dates after this value.<br/><b>Must stay after (or equal to) the minimum</b> \u2014 inverted bounds leave no selectable date.
fmdbmix_relativeMinDate=Relative minimum date
fmdbmix_relativeMinDate.minRelativeAmount=Offset from the current date
fmdbmix_relativeMinDate.minRelativeAmount.ui.tooltip=Signed number of units added to the current date to obtain the minimum selectable date. <b>Examples:</b> <i>-18 years keeps dates at least 18 years in the past (age limit); +30 days allows at most 30 days ahead (booking window)</i>.<br/><b>Must stay before (or equal to) the maximum</b> \u2014 inverted bounds leave no selectable date.
fmdbmix_relativeMinDate.minRelativeUnit=Offset unit
fmdbmix_relativeMinDate.minRelativeUnit.ui.tooltip=Days, months or years. Month and year arithmetic clamps to the end of shorter months (January 31 + 1 month = February 28 or 29).
fmdbmix_relativeMaxDate=Relative maximum date
fmdbmix_relativeMaxDate.maxRelativeAmount=Offset from the current date
fmdbmix_relativeMaxDate.maxRelativeAmount.ui.tooltip=Signed number of units added to the current date to obtain the maximum selectable date. <b>Examples:</b> <i>-18 years keeps dates at least 18 years in the past (age limit); +30 days allows at most 30 days ahead (booking window)</i>.<br/><b>Must stay after (or equal to) the minimum</b> \u2014 inverted bounds leave no selectable date.
fmdbmix_relativeMaxDate.maxRelativeUnit=Offset unit
fmdbmix_relativeMaxDate.maxRelativeUnit.ui.tooltip=Days, months or years. Month and year arithmetic clamps to the end of shorter months (January 31 + 1 month = February 28 or 29).
fmdbmix_datetimeBounds=Datetime bounds
fmdbmix_datetimeBounds.minBoundMode=Minimum datetime origin
fmdbmix_datetimeBounds.minBoundMode.ui.tooltip=Where the earliest selectable datetime comes from: none, a fixed datetime, or the current date \u2014 from the start of the day the visitor submits the form.<br/><b>Usage of the current date:</b> <i>Appointment or reservation slots that must not be in the past</i>.
fmdbmix_datetimeBounds.maxBoundMode=Maximum datetime origin
fmdbmix_datetimeBounds.maxBoundMode.ui.tooltip=Where the latest selectable datetime comes from: none, a fixed datetime, or the current date \u2014 until the end of the day the visitor submits the form.<br/><b>Usage of the current date:</b> <i>Event datetimes that must not be in the future</i>.
fmdbmix_fixedMinDatetime=Fixed minimum datetime
fmdbmix_fixedMinDatetime.min=Minimum datetime
fmdbmix_fixedMinDatetime.min.ui.tooltip=The earliest datetime that can be selected.<br/><b>Validation:</b> Prevents selection of datetimes before this value.<br/><b>Must stay before (or equal to) the maximum</b> \u2014 inverted bounds leave no selectable date.
fmdbmix_fixedMaxDatetime=Fixed maximum datetime
fmdbmix_fixedMaxDatetime.max=Maximum datetime
fmdbmix_fixedMaxDatetime.max.ui.tooltip=The latest datetime that can be selected.<br/><b>Validation:</b> Prevents selection of datetimes after this value.<br/><b>Must stay after (or equal to) the minimum</b> \u2014 inverted bounds leave no selectable date.
fmdbmix_relativeMinDatetime=Relative minimum datetime
fmdbmix_relativeMinDatetime.minRelativeAmount=Offset from the current date
fmdbmix_relativeMinDatetime.minRelativeAmount.ui.tooltip=Signed number of units added to the current date to obtain the minimum selectable datetime. <b>Examples:</b> <i>-18 years keeps dates at least 18 years in the past (age limit); +30 days allows at most 30 days ahead (booking window)</i>.<br/><b>Must stay before (or equal to) the maximum</b> \u2014 inverted bounds leave no selectable date.
fmdbmix_relativeMinDatetime.minRelativeUnit=Offset unit
fmdbmix_relativeMinDatetime.minRelativeUnit.ui.tooltip=Days, months or years. Month and year arithmetic clamps to the end of shorter months (January 31 + 1 month = February 28 or 29).
fmdbmix_relativeMaxDatetime=Relative maximum datetime
fmdbmix_relativeMaxDatetime.maxRelativeAmount=Offset from the current date
fmdbmix_relativeMaxDatetime.maxRelativeAmount.ui.tooltip=Signed number of units added to the current date to obtain the maximum selectable datetime. <b>Examples:</b> <i>-18 years keeps dates at least 18 years in the past (age limit); +30 days allows at most 30 days ahead (booking window)</i>.<br/><b>Must stay after (or equal to) the minimum</b> \u2014 inverted bounds leave no selectable date.
fmdbmix_relativeMaxDatetime.maxRelativeUnit=Offset unit
fmdbmix_relativeMaxDatetime.maxRelativeUnit.ui.tooltip=Days, months or years. Month and year arithmetic clamps to the end of shorter months (January 31 + 1 month = February 28 or 29).

