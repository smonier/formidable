# default configuration - deployed once, then kept as edited.
# Formidable engine configuration (PID org.jahia.modules.formidable). Jahia copies this file
# to digital-factory-data/karaf/etc the first time the module starts without it there, and
# the line above tells Jahia never to overwrite that copy: edit it, or use the provisioning
# API (editConfiguration), your changes are kept. Avoid the Felix Web Console for this PID:
# it rewrites the file in a typed syntax (L"5", quoted strings) a .cfg file does not read
# back. Every value below is the built-in default.

# --- CAPTCHA ---
captchaSiteKey=
captchaSecretKey=
captchaScriptUrl=
captchaWidgetVar=
captchaTokenField=
captchaVerifyUrl=
captchaHttpConnectTimeoutSeconds=5
captchaHttpRequestTimeoutSeconds=10

# --- FILE UPLOAD ---
uploadMaxFileSizeBytes=10485760
uploadMaxRequestSizeBytes=52428800
uploadMaxFileCount=10
uploadAllowedMimeTypes=image/jpeg,image/png,image/gif,image/webp,application/pdf,application/msword,application/vnd.openxmlformats-officedocument.wordprocessingml.document,application/vnd.ms-excel,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet,application/vnd.oasis.opendocument.text,application/vnd.oasis.opendocument.spreadsheet,text/plain,text/csv,video/mp4,video/webm,video/ogg,video/x-matroska

# --- CHOICE FIELD OPTIONS SOURCES ---
# Each entry: id|Label|initializerKey or id|Label|initializerKey|param
# initializerKey is the key of a Jahia choicelist initializer (e.g. country, language).
# The id is stored in JCR; only sources listed here are exposed to contributors.
# Leave empty to disable sourced options (fail-safe default).
# One source per line INSIDE the value: an escaped \n followed by a \ line continuation, as in
# the example (two plain lines would be read as two keys). The provisioning API and the Felix
# console write the same value on a single line, with a literal \n between the entries.
# Example:
#   optionsSources=countries|Countries|country\n\
#     departments|Departments|myModuleDepartmentsInitializer
optionsSources=
optionsSourcesCacheTtlSeconds=300
# Maximum number of options a content-mode choice field may resolve. Above the
# limit the field fails explicitly like a failing source, so contributors
# re-scope their root instead of visitors silently missing options.
optionsQueryMaxResults=100

# --- FORWARD ACTION ---
# Each entry: id|Label|https://target-url
# The id is stored in JCR; the URL is resolved server-side and never exposed to contributors.
# Leave empty to disable all forward actions (fail-safe default).
# One target per line INSIDE the value, with the same \n\ continuation as optionsSources.
# Example:
#   forwardTargets=salesforce-prod|Salesforce Prod|https://api.salesforce.com/services/data/v59.0/sobjects/Lead/\n\
#     crm-staging|CRM Staging|https://crm.internal/hook
forwardTargets=
enableDevForwardTargets=false
# Development-only targets. Only plain HTTP on localhost or host.docker.internal is accepted.
# Ignored unless enableDevForwardTargets=true.
# Example (same \n\ continuation between the entries):
#   devForwardTargets=local-api|Local API|http://localhost:3000/hook\n\
#     docker-api|Docker API|http://host.docker.internal:8080/hook
devForwardTargets=
forwardHttpConnectTimeoutSeconds=5
forwardHttpRequestTimeoutSeconds=10
# --- FIELD ACTIONS ---
# The external services a field action may call through the FieldActionGateway.
# Each entry: id|Label|https://base-url|Credential-Header-Name|credential (the last two together, or neither).
# The id is stored in JCR on the field-action node; the base URL, the header and the credential stay
# here and never reach a contributor, a JavaScript action or a log line.
# One provider per line INSIDE the value, with the same \n\ continuation as optionsSources.
# Example:
#   fieldActionProviders=email-check|Email verification|https://api.example.com/v1|X-Api-Key|s3cr3t\n\
#     crm|Customer directory|https://crm.internal/api
fieldActionProviders=
fieldActionHttpConnectTimeoutSeconds=5
fieldActionHttpRequestTimeoutSeconds=10
# Verdicts kept per action and value, so the check run while the visitor filled the form costs no
# second provider call at submission. 0 disables the cache.
fieldActionVerdictCacheTtlSeconds=300
# Pre-checks accepted per client address and minute on /modules/formidable-engine/field-action;
# 0 disables the endpoint (the field actions then run at submission only).
fieldActionRateLimitPerMinute=30
# Longest value a pre-check accepts from the browser (HTTP 413 above).
fieldActionMaxValueLength=512
# DISTINCT values of ONE field the submission judges with that field's blocking actions. A field name can be
# submitted many times over and each distinct value may cost a provider call — repeats are answered by the
# verdict cache — so a submission carrying more than this for one field is refused (FMDB-017) before anything
# runs. Above a plausible option count on purpose: an "interests" checkbox group is an ordinary thing to build.
fieldActionMaxValuesPerField=50
