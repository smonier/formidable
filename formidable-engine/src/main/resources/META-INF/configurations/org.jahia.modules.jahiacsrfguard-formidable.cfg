# The form submission endpoint is public by design: every visitor, anonymous or
# authenticated, posts to it without an OWASP CSRFGuard token — the markup of a
# published form carries none. Cross-site submissions are already rejected by the
# engine's own same-origin guard, so the token requirement jahia-csrf-guard 4.3
# started enforcing on authenticated sessions is lifted for this single endpoint.
# The trailing wildcard covers the endpoint's actual surface, not future siblings:
# the OSGi alias mapping is prefix-based (subpaths dispatch to the same servlet),
# and the guard falls back to matching the raw request URI — where a cookie-less
# authenticated session carries a ;jsessionid suffix — when servletPath+pathInfo
# resolve empty. An exact pattern would reopen the rejection in those cases.
whitelist = /modules/formidable-engine/form-submit*,/modules/formidable-engine/field-action*
